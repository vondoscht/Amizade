name: Repair index v1.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-index-v1-8.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar index completo e alinhar versão
        run: |
          git show eb0cb4323ff5ebd16b6457614306f717fe29290e^:index2.html > index2.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index2.html')
          s = p.read_text()
          s = s.replace('<title>Amz v1.6</title>', '<title>Amz v1.8</title>')
          s = s.replace('<title>Amz v1.7</title>', '<title>Amz v1.8</title>')
          p.write_text(s)
          PY

      - name: Commitar e remover workflow temporário
        run: |
          rm .github/workflows/repair-index-v1-8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Amz v1.8 - Restaura index completo"
          git push
