name: Restaurar PWA mobile v1.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restaurar-pwa-v1-6.yml'

permissions:
  contents: write

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar PWA somente no app mobile
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('app.html')
          app = app_path.read_text(encoding='utf-8')

          app = app.replace('<title>Amz v1.5</title>', '<title>Amz v1.6</title>')

          old_head = '''  <meta name="theme-color" content="#111319">\n  <title>Amz v1.6</title>\n\n  <link rel="icon" type="image/png" href="assets/avatar.png">\n  <link rel="apple-touch-icon" href="assets/avatar.png">'''
          new_head = '''  <meta name="theme-color" content="#111319">\n  <title>Amz v1.6</title>\n\n  <meta name="mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n  <meta name="apple-mobile-web-app-title" content="Rádio Amizade">\n  <meta name="application-name" content="Rádio Amizade">\n\n  <link rel="icon" type="image/png" href="assets/avatar.png?v=1.6">\n  <link rel="apple-touch-icon" href="assets/avatar.png?v=1.6">\n  <link rel="manifest" href="manifest.webmanifest?v=1.6">'''

          if old_head not in app:
              raise SystemExit('Bloco esperado do head não encontrado em app.html')
          app = app.replace(old_head, new_head, 1)

          sw_registration = '''\n  <script>\n    if ("serviceWorker" in navigator) {\n      window.addEventListener("load", () => {\n        navigator.serviceWorker.register("./service-worker.js", {\n          scope: "./app.html",\n          updateViaCache: "none"\n        }).then((registration) => registration.update()).catch(() => {});\n      });\n    }\n  </script>\n'''

          if 'navigator.serviceWorker.register("./service-worker.js"' not in app:
              app = app.replace('</body>', sw_registration + '</body>', 1)

          app_path.write_text(app, encoding='utf-8')

          index_path = Path('index2.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('<title>Amz v1.5</title>', '<title>Amz v1.6</title>')
          index_path.write_text(index, encoding='utf-8')
          PY

          cat > manifest.webmanifest <<'EOF'
          {
            "id": "./app.html",
            "name": "Rádio Amizade",
            "short_name": "Amizade",
            "description": "Ouça a Rádio Amizade 98.7 FM ao vivo.",
            "lang": "pt-BR",
            "dir": "ltr",
            "start_url": "./app.html?source=pwa",
            "scope": "./",
            "display": "standalone",
            "display_override": ["standalone", "minimal-ui"],
            "orientation": "portrait",
            "background_color": "#111319",
            "theme_color": "#111319",
            "icons": [
              {
                "src": "icons/icon-192.png?v=1.6",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "icons/icon-512.png?v=1.6",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "icons/icon-maskable-512.png?v=1.6",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "maskable"
              }
            ]
          }
          EOF

          cat > service-worker.js <<'EOF'
          const CACHE_NAME = "radio-amizade-mobile-v1.6";

          const APP_SHELL = [
            "./app.html",
            "./manifest.webmanifest?v=1.6",
            "./assets/avatar.png?v=1.6",
            "./assets/icone-instagram.svg",
            "./assets/icone-facebook.svg",
            "./assets/icone-youtube.svg",
            "./assets/icone-whatsapp.svg",
            "./icons/icon-192.png?v=1.6",
            "./icons/icon-512.png?v=1.6",
            "./icons/icon-maskable-512.png?v=1.6"
          ];

          self.addEventListener("install", (event) => {
            event.waitUntil(
              caches.open(CACHE_NAME)
                .then((cache) => cache.addAll(APP_SHELL))
                .then(() => self.skipWaiting())
            );
          });

          self.addEventListener("activate", (event) => {
            event.waitUntil(
              caches.keys()
                .then((keys) => Promise.all(
                  keys
                    .filter((key) => key.startsWith("radio-amizade-mobile-") && key !== CACHE_NAME)
                    .map((key) => caches.delete(key))
                ))
                .then(() => self.clients.claim())
            );
          });

          self.addEventListener("fetch", (event) => {
            const request = event.request;
            if (request.method !== "GET") return;

            const url = new URL(request.url);

            // O stream, fontes e CDNs externos nunca passam pelo cache do PWA.
            if (url.origin !== self.location.origin) return;

            // A navegação do app usa rede primeiro e cache apenas como fallback offline.
            if (request.mode === "navigate") {
              event.respondWith(
                fetch(request)
                  .then((response) => {
                    const copy = response.clone();
                    caches.open(CACHE_NAME).then((cache) => cache.put("./app.html", copy));
                    return response;
                  })
                  .catch(() => caches.match("./app.html"))
              );
              return;
            }

            // Assets locais: cache com atualização em segundo plano.
            event.respondWith(
              caches.match(request).then((cached) => {
                const network = fetch(request).then((response) => {
                  if (response && response.status === 200 && response.type === "basic") {
                    const copy = response.clone();
                    caches.open(CACHE_NAME).then((cache) => cache.put(request, copy));
                  }
                  return response;
                });

                return cached || network;
              })
            );
          });
          EOF

          mkdir -p icons
          git checkout 6886a2dfd62f94968c1877260f3d7a0cc60c7e93 -- \
            icons/icon-192.png \
            icons/icon-512.png \
            icons/icon-maskable-512.png

          cat > README.md <<'EOF'
          # Rádio Amizade — v1.6

          Site da Rádio Amizade 98.7 FM.

          ## Estrutura atual

          - `index2.html` — versão desktop e entrada temporária do site; em telas de até 900 px redireciona para `app.html`.
          - `app.html` — interface mobile e base do PWA.
          - `manifest.webmanifest` — manifesto do PWA mobile.
          - `service-worker.js` — service worker registrado somente para `app.html`.
          - `icons/` — ícones de instalação do PWA.
          - `assets/` — imagens e ícones usados pelas interfaces.

          ## Regra de exibição

          - acima de 900 px: permanece no site desktop.
          - 900 px ou menos: abre `app.html`.

          ## PWA

          O PWA é anunciado e registrado somente em `app.html`. A página desktop não inclui manifesto nem registra service worker. O service worker usa escopo restrito a `app.html`, evitando interferência na versão desktop.
          EOF

          rm -f .github/workflows/restaurar-pwa-v1-6.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Amz v1.6 - Restaura PWA na versão mobile"
          git push
