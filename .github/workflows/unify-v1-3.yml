name: Unificar sem iframe v1.3

on:
  push:
    paths:
      - '.github/workflows/unify-v1-3.yml'

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar v1.3
        shell: bash
        run: |
          cp desktop.html index2.html

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index2.html')
          s = p.read_text(encoding='utf-8')

          css_path = Path('desktop-hover-v1.2.css')
          if css_path.exists():
              css = css_path.read_text(encoding='utf-8')
              s = s.replace('<link rel="stylesheet" href="desktop-hover-v1.2.css">', f'<style>\n{css}\n</style>', 1)

          s = re.sub(r'<title>.*?</title>', '<title>Amz v1.3</title>', s, count=1, flags=re.S)

          redirect = '''\n  <script>\n    if (window.matchMedia("(max-width: 900px)").matches) {\n      window.location.replace("app.html");\n    }\n  </script>'''
          s = s.replace('<head>', '<head>' + redirect, 1)

          p.write_text(s, encoding='utf-8')

          p = Path('app.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<title>.*?</title>', '<title>Amz v1.3</title>', s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')

          Path('README.md').write_text('''# Rádio Amizade — v1.3\n\nEstrutura atual:\n\n- `index2.html` — site desktop direto, sem iframe. Em telas de até 900 px redireciona imediatamente para `app.html`.\n- `app.html` — interface compacta para intermediário/mobile.\n- `assets/` — imagens e ícones usados pelas interfaces.\n\nO iframe foi removido para preservar interação nativa do mouse, hover e cursor no desktop.\n''', encoding='utf-8')
          PY

          rm -f desktop.html desktop-hover-v1.2.css
          rm -f .github/workflows/unify-v1-3.yml

      - name: Commit
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove iframe e restaura interação desktop — v1.3"
          git push
