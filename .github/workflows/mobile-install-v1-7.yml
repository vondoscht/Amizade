name: Mobile install v1.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-install-v1-7.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar app mobile e versão
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.html')
          s = app.read_text()

          s = s.replace('<title>Amz v1.6</title>', '<title>Amz v1.7</title>')
          s = s.replace('assets/avatar.png?v=1.6', 'assets/avatar.png?v=1.7')
          s = s.replace('manifest.webmanifest?v=1.6', 'manifest.webmanifest?v=1.7')

          old_css = '''    .site-link{
      position:absolute;
      z-index:20;
      top:var(--top);
      left:50%;
      transform:translateX(-50%);
      padding:8px 16px;
      border-radius:999px;
      color:rgba(255,255,255,.82);
      background:rgba(29,32,39,.82);
      box-shadow:0 10px 24px rgba(0,0,0,.18);
      font-size:14px;
      font-weight:700;
      line-height:1;
      text-decoration:none;
      white-space:nowrap;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }
'''

          new_css = '''    .install-btn{
      position:absolute;
      z-index:20;
      top:var(--top);
      left:50%;
      transform:translateX(-50%);
      padding:8px 16px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:999px;
      color:rgba(255,255,255,.88);
      background:rgba(29,32,39,.90);
      box-shadow:0 10px 24px rgba(0,0,0,.18);
      font-size:14px;
      font-weight:700;
      line-height:1;
      white-space:nowrap;
      cursor:pointer;
    }

    .install-btn[hidden]{display:none}
'''

          if old_css not in s:
              raise SystemExit('Bloco .site-link não encontrado')
          s = s.replace(old_css, new_css)

          old_html = '    <a class="site-link" href="https://amizade.fm.br/">amizade.fm.br</a>'
          new_html = '    <button class="install-btn" id="installButton" type="button" hidden>Instalar app</button>'
          if old_html not in s:
              raise SystemExit('Link do topo não encontrado')
          s = s.replace(old_html, new_html)

          marker = '''  <script>
    if ("serviceWorker" in navigator) {'''
          install_script = '''  <script>
    (() => {
      const installButton = document.getElementById("installButton");
      let deferredPrompt = null;

      const isStandalone = () =>
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;

      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

      function updateInstallButton() {
        installButton.hidden = isStandalone();
      }

      updateInstallButton();

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredPrompt = event;
        if (!isStandalone()) installButton.hidden = false;
      });

      installButton.addEventListener("click", async () => {
        if (isStandalone()) {
          installButton.hidden = true;
          return;
        }

        if (deferredPrompt) {
          deferredPrompt.prompt();
          const choice = await deferredPrompt.userChoice;
          deferredPrompt = null;
          if (choice.outcome === "accepted") installButton.hidden = true;
          return;
        }

        if (isIOS) {
          alert('No Safari, toque em Compartilhar e depois em “Adicionar à Tela de Início”.');
          return;
        }

        alert('Abra o menu do navegador e escolha “Instalar app” ou “Adicionar à tela inicial”.');
      });

      window.addEventListener("appinstalled", () => {
        deferredPrompt = null;
        installButton.hidden = true;
      });
    })();
  </script>

'''
          if marker not in s:
              raise SystemExit('Marcador do service worker não encontrado')
          s = s.replace(marker, install_script + marker)
          app.write_text(s)

          manifest = Path('manifest.webmanifest')
          m = manifest.read_text().replace('v=1.6', 'v=1.7')
          manifest.write_text(m)

          sw = Path('service-worker.js')
          w = sw.read_text().replace('radio-amizade-mobile-v1.6', 'radio-amizade-mobile-v1.7').replace('v=1.6', 'v=1.7')
          sw.write_text(w)

          index = Path('index2.html')
          i = index.read_text().replace('<title>Amz v1.6</title>', '<title>Amz v1.7</title>')
          index.write_text(i)
          PY

      - name: Commitar alteração e remover workflow temporário
        run: |
          rm .github/workflows/mobile-install-v1-7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Amz v1.7 - Botão de instalação no mobile"
          git push
