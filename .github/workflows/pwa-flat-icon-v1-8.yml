name: PWA flat icon v1.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pwa-flat-icon-v1-8.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ícone plano no PWA
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.html')
          s = app.read_text()
          s = s.replace('<title>Amz v1.7</title>', '<title>Amz v1.8</title>')
          s = s.replace('assets/avatar.png?v=1.7', 'assets/avatar.png?v=1.8')
          s = s.replace('manifest.webmanifest?v=1.7', 'manifest.webmanifest?v=1.8')
          app.write_text(s)

          index = Path('index2.html')
          i = index.read_text().replace('<title>Amz v1.7</title>', '<title>Amz v1.8</title>')
          index.write_text(i)

          sw = Path('service-worker.js')
          w = sw.read_text()
          w = w.replace('radio-amizade-mobile-v1.7', 'radio-amizade-mobile-v1.8')
          w = w.replace('v=1.7', 'v=1.8')
          lines = []
          for line in w.splitlines():
              if 'icons/icon-192.png' in line or 'icons/icon-512.png' in line or 'icons/icon-maskable-512.png' in line:
                  continue
              lines.append(line)
          w = '\n'.join(lines) + '\n'
          sw.write_text(w)
          PY

          rm -f icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png

      - name: Commitar e remover workflow temporário
        run: |
          rm .github/workflows/pwa-flat-icon-v1-8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Amz v1.8 - Corrige ícone do PWA"
          git push
