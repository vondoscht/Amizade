name: Restore install UI v1.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-install-ui-v1-9.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar visual antigo da instalação PWA
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.html')
          s = app.read_text()

          s = s.replace('<title>Amz v1.8</title>', '<title>Amz v1.9</title>')
          s = s.replace('assets/avatar.png?v=1.8', 'assets/avatar.png?v=1.9')
          s = s.replace('manifest.webmanifest?v=1.8', 'manifest.webmanifest?v=1.9')

          old_btn = '''    .install-btn{
      position:absolute;
      z-index:20;
      top:var(--top);
      left:50%;
      transform:translateX(-50%);
      padding:8px 16px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:999px;
      color:rgba(255,255,255,.88);
      background:rgba(29,32,39,.90);
      box-shadow:0 10px 24px rgba(0,0,0,.18);
      font-size:14px;
      font-weight:700;
      line-height:1;
      white-space:nowrap;
      cursor:pointer;
    }

    .install-btn[hidden]{display:none}
'''

          new_btn = '''    .install-btn{
      position:absolute;
      z-index:20;
      top:var(--top);
      left:50%;
      transform:translateX(-50%);
      padding:8px 16px;
      border:1px solid rgba(255,217,26,.18);
      border-radius:999px;
      color:#111319;
      background:#ffd91a;
      box-shadow:0 10px 24px rgba(0,0,0,.18);
      font-size:14px;
      font-weight:800;
      line-height:1;
      white-space:nowrap;
      cursor:pointer;
    }

    .install-btn[hidden]{display:none}

    .install-sheet[hidden]{display:none}

    .install-sheet{
      position:fixed;
      z-index:200;
      inset:0;
      display:grid;
      place-items:end center;
      padding:20px 16px calc(16px + env(safe-area-inset-bottom));
      background:rgba(0,0,0,.46);
    }

    .install-sheet__card{
      width:min(100%,430px);
      padding:20px;
      border:1px solid rgba(255,255,255,.10);
      border-radius:24px;
      color:#fff;
      background:#1d2027;
      box-shadow:0 24px 70px rgba(0,0,0,.42);
    }

    .install-sheet__card h2{
      margin:0 0 10px;
      font-size:18px;
      line-height:1.2;
    }

    .install-sheet__card p{
      margin:0;
      color:rgba(255,255,255,.78);
      font-size:14px;
      line-height:1.5;
    }

    .install-sheet__card strong{color:#ffd91a}

    .install-sheet__close{
      width:100%;
      min-height:46px;
      margin-top:18px;
      border-radius:15px;
      color:#111319;
      background:#ffd91a;
      font-weight:800;
      cursor:pointer;
    }
'''

          if old_btn not in s:
              raise SystemExit('Bloco atual do botão de instalação não encontrado')
          s = s.replace(old_btn, new_btn)

          old_after_main = '''  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>'''
          new_after_main = '''  </main>

  <div
    class="install-sheet"
    id="installSheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="installSheetTitle"
    hidden
  >
    <div class="install-sheet__card">
      <h2 id="installSheetTitle">Adicionar à Tela de Início</h2>
      <p>
        No iPhone, toque em <strong>Compartilhar</strong> no Safari e escolha
        <strong>Adicionar à Tela de Início</strong>.
      </p>
      <button
        class="install-sheet__close"
        id="installSheetClose"
        type="button"
      >
        Entendi
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>'''
          if old_after_main not in s:
              raise SystemExit('Ponto de inserção do tutorial não encontrado')
          s = s.replace(old_after_main, new_after_main)

          old_start = '''      const installButton = document.getElementById("installButton");
      let deferredPrompt = null;'''
          new_start = '''      const installButton = document.getElementById("installButton");
      const installSheet = document.getElementById("installSheet");
      const installSheetClose = document.getElementById("installSheetClose");
      let deferredPrompt = null;'''
          if old_start not in s:
              raise SystemExit('Início do script de instalação não encontrado')
          s = s.replace(old_start, new_start)

          old_ios = '''        if (isIOS) {
          alert('No Safari, toque em Compartilhar e depois em “Adicionar à Tela de Início”.');
        }
      });

      window.addEventListener("appinstalled", () => {
        deferredPrompt = null;
        installButton.hidden = true;
      });'''
          new_ios = '''        if (isIOS) {
          installSheet.hidden = false;
          installSheetClose.focus();
        }
      });

      installSheetClose.addEventListener("click", () => {
        installSheet.hidden = true;
      });

      installSheet.addEventListener("click", (event) => {
        if (event.target === installSheet) installSheet.hidden = true;
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !installSheet.hidden) installSheet.hidden = true;
      });

      window.addEventListener("appinstalled", () => {
        deferredPrompt = null;
        installButton.hidden = true;
        installSheet.hidden = true;
      });'''
          if old_ios not in s:
              raise SystemExit('Fluxo atual do iPhone não encontrado')
          s = s.replace(old_ios, new_ios)

          app.write_text(s)

          manifest = Path('manifest.webmanifest')
          m = manifest.read_text().replace('v=1.8', 'v=1.9')
          manifest.write_text(m)

          sw = Path('service-worker.js')
          w = sw.read_text().replace('radio-amizade-mobile-v1.8', 'radio-amizade-mobile-v1.9').replace('v=1.8', 'v=1.9')
          sw.write_text(w)

          index = Path('index2.html')
          i = index.read_text().replace('<title>Amz v1.8</title>', '<title>Amz v1.9</title>')
          index.write_text(i)
          PY

      - name: Commitar e remover workflow temporário
        run: |
          rm .github/workflows/restore-install-ui-v1-9.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Amz v1.9 - Restaura visual antigo da instalação PWA"
          git push
