# trigger
name: Test contact warm modern

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-contact-warm-modern.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar visual do card Contato
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index2.html')
          s = p.read_text()

          old = '''    .contact-card {
      width: var(--side-column);
      min-width: var(--side-column);
      background:
        radial-gradient(circle at 84% 10%, rgba(255,238,120,.34) 0%, rgba(255,238,120,0) 32%),
        linear-gradient(135deg,#ff493c 0%,#ff8d32 48%,#f5cd24 100%);
      border-color: rgba(255,255,255,.18);
      color: #fff;
    }
'''

          new = '''    .contact-card {
      width: var(--side-column);
      min-width: var(--side-column);
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 84% 12%, rgba(255,239,145,.34) 0%, rgba(255,239,145,0) 28%),
        radial-gradient(circle at 8% 88%, rgba(255,102,159,.20) 0%, rgba(255,102,159,0) 34%),
        linear-gradient(135deg,#c81955 0%,#e6326f 27%,#ff6548 51%,#f69a2c 75%,#f6cf38 100%);
      border-color: rgba(255,255,255,.18);
      color: #fff;
      box-shadow: 0 18px 38px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.10);
    }

    .contact-card::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      background:
        linear-gradient(118deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,0) 34%),
        radial-gradient(ellipse at 38% -8%, rgba(255,255,255,.13) 0%, rgba(255,255,255,0) 48%);
      pointer-events: none;
    }

    .contact-card::after {
      content: "";
      position: absolute;
      z-index: 0;
      right: -74px;
      bottom: -86px;
      width: 220px;
      height: 220px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 50%;
      box-shadow:
        0 0 0 28px rgba(255,255,255,.07),
        0 0 0 60px rgba(255,255,255,.035);
      pointer-events: none;
    }

    .contact-card > * {
      position: relative;
      z-index: 1;
    }
'''

          if old not in s:
              raise SystemExit('Bloco atual do card Contato não encontrado')

          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commitar teste e remover workflow temporário
        run: |
          rm .github/workflows/test-contact-warm-modern.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Testa visual quente e moderno no card Contato"
          git push
