name: Hover desktop v1.2

on:
  push:
    paths:
      - '.github/workflows/hover-v1-2.yml'

permissions:
  contents: write

jobs:
  hover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ajustar hover e versão
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          desktop = Path('desktop.html')
          s = desktop.read_text(encoding='utf-8')

          hover_css = r'''

    /* Hover desktop — v1.2 */
    .brand-image {
      transition: transform .22s ease, filter .22s ease;
    }

    .brand:hover .brand-image {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .social {
      transition: transform .22s ease, background .22s ease, border-color .22s ease, box-shadow .22s ease;
    }

    .social:hover {
      transform: translateY(-3px);
      background: linear-gradient(180deg,var(--gray-750) 0%,var(--gray-800) 100%);
      border-color: rgba(255,255,255,.28);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 12px 24px rgba(0,0,0,.20), 0 0 18px rgba(255,255,255,.12);
    }

    .live-btn .icon {
      transition: transform .22s ease, background .32s cubic-bezier(.22,.61,.36,1), filter .32s cubic-bezier(.22,.61,.36,1), box-shadow .32s cubic-bezier(.22,.61,.36,1);
    }

    .live-btn .icon:hover {
      transform: scale(1.035);
    }

    .quick-image:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 14px 30px rgba(0,0,0,.18), 0 0 20px rgba(255,255,255,.11);
    }

    .sponsor-card {
      transition: transform .22s ease, box-shadow .22s ease;
    }

    .sponsor-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(0,0,0,.16);
    }

    .dot {
      transition: transform .18s ease, background .18s ease, opacity .18s ease;
    }

    .dot:hover {
      transform: scale(1.45);
      background: #fff;
    }

    .program {
      transition: transform .18s ease, background .2s ease, box-shadow .2s ease;
    }

    .program:hover {
      transform: translateX(4px);
      background: #ffe2ec;
    }

    .contact-link:hover {
      color: var(--red);
    }
'''

          if '/* Hover desktop — v1.2 */' not in s:
              pos = s.rfind('</style>')
              if pos == -1:
                  raise SystemExit('desktop.html sem </style>')
              s = s[:pos] + hover_css + '\n  ' + s[pos:]

          s = re.sub(r'<title>.*?</title>', '<title>Amz v1.2</title>', s, count=1, flags=re.S)
          desktop.write_text(s, encoding='utf-8')

          for name in ('index2.html', 'app.html'):
              p = Path(name)
              t = p.read_text(encoding='utf-8')
              t = re.sub(r'<title>.*?</title>', '<title>Amz v1.2</title>', t, count=1, flags=re.S)
              p.write_text(t, encoding='utf-8')

          readme = Path('README.md')
          if readme.exists():
              r = readme.read_text(encoding='utf-8')
              r = re.sub(r'v1\.1', 'v1.2', r)
              readme.write_text(r, encoding='utf-8')
          PY

          rm -f .github/workflows/hover-v1-2.yml

      - name: Commit
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Restaura hover desktop — v1.2"
          git push
