name: Restore desktop header blur

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-header-blur.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar blur somente no cabeçalho ao rolar
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index2.html')
          s = p.read_text()

          old = '''      background: transparent;\n      box-shadow: none;\n      transition: background .28s ease, border-color .28s ease, box-shadow .28s ease, border-radius .28s ease;'''
          new = '''      background: transparent;\n      box-shadow: none;\n      backdrop-filter: blur(0);\n      -webkit-backdrop-filter: blur(0);\n      transition: background .28s ease, border-color .28s ease, box-shadow .28s ease, backdrop-filter .28s ease, -webkit-backdrop-filter .28s ease, border-radius .28s ease;'''
          if old not in s:
              raise SystemExit('Bloco base do cabeçalho não encontrado')
          s = s.replace(old, new, 1)

          old2 = '''      border-radius: 12px;\n      box-shadow: 0 16px 42px rgba(0,0,0,.22);\n    }'''
          new2 = '''      border-radius: 12px;\n      box-shadow: 0 16px 42px rgba(0,0,0,.22);\n      backdrop-filter: blur(16px);\n      -webkit-backdrop-filter: blur(16px);\n    }'''
          if old2 not in s:
              raise SystemExit('Estado scrolled do cabeçalho não encontrado')
          s = s.replace(old2, new2, 1)

          p.write_text(s)
          PY

      - name: Commitar alteração e remover workflow temporário
        run: |
          rm .github/workflows/restore-header-blur.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restaura blur no cabeçalho desktop ao rolar"
          git push
