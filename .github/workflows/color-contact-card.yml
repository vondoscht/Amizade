name: Color contact card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/color-contact-card.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar gradiente ao card de contato
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index2.html')
          s = p.read_text()

          old = '''    .contact-card {
      width: var(--side-column);
      min-width: var(--side-column);
    }
'''
          new = '''    .contact-card {
      width: var(--side-column);
      min-width: var(--side-column);
      background: linear-gradient(135deg,#ffd91a 0%,#ffb51a 100%);
      border-color: rgba(255,255,255,.16);
    }
'''
          if old not in s:
              raise SystemExit('Bloco .contact-card esperado não encontrado')
          s = s.replace(old, new, 1)

          old2 = '''    .about-card h2::after, .contact-card h2::after {
      content: "";
      display: block;
      width: 34px;
      height: 3px;
      margin-top: 9px;
      border-radius: 999px;
      background: var(--yellow);
    }
'''
          new2 = '''    .about-card h2::after, .contact-card h2::after {
      content: "";
      display: block;
      width: 34px;
      height: 3px;
      margin-top: 9px;
      border-radius: 999px;
      background: var(--yellow);
    }

    .contact-card h2::after {
      background: var(--red);
    }
'''
          if old2 not in s:
              raise SystemExit('Pseudo-elemento esperado não encontrado')
          s = s.replace(old2, new2, 1)

          p.write_text(s)
          PY

      - name: Commitar ajuste e remover workflow temporário
        run: |
          rm .github/workflows/color-contact-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplica gradiente amarelo ao contato no desktop"
          git push
