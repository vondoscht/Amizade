name: Reorganizar site e app

on:
  push:
    paths:
      - '.github/workflows/restructure-site.yml'

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reorganizar arquivos
        run: |
          cp index.html app.html
          cp radio_amizade_final.html index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a class="quick-image" href="#" aria-label="Baixe o app para iPhone">'
          new = '<a class="quick-image" href="app.html" aria-label="Abra o aplicativo da Rádio Amizade">'
          if old not in s:
              raise SystemExit('Botão do aplicativo não encontrado no site.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm radio_amizade_final.html

      - name: Commit
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.html radio_amizade_final.html
          git commit -m "Organiza site como index e app como app.html"
          git push
