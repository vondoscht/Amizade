        <div class="quick-row" aria-label="Acessos rápidos" style="grid-template-columns:1fr; gap:var(--section-gap)">
          <a class="quick-image" href="https://wa.me/5551998770145" target="_blank" rel="noopener noreferrer" aria-label="Fale com a Rádio Amizade pelo WhatsApp">
            <img src="assets/botao-whatsapp.png" alt="Botão de WhatsApp">
          </a>

          <a class="quick-image" href="https://wa.me/555180527460" target="_blank" rel="noopener noreferrer" aria-label="Anuncie na Rádio Amizade pelo WhatsApp">
