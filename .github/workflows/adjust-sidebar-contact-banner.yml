name: Adjust desktop sidebar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-sidebar-contact-banner.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar banner e mover contato para coluna lateral
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index2.html')
          s = p.read_text()

          s = s.replace('''    .sponsor-wrap {
      width: var(--side-column);
      min-width: var(--side-column);
      height: auto;
    }
''', '''    .sponsor-wrap {
      width: var(--side-column);
      min-width: var(--side-column);
      height: 300px;
    }
''', 1)

          s = s.replace('''    .sponsor-card {
      display: block;
      width: var(--side-column);
      height: auto;
''', '''    .sponsor-card {
      display: block;
      width: var(--side-column);
      height: 300px;
''', 1)

          s = s.replace('''    .sponsor-card img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
''', '''    .sponsor-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
''', 1)

          old = '''    <div class="main-content-grid" aria-label="Acessos, programação e patrocinador">

