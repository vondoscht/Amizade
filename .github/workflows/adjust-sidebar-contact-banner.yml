name: Adjust desktop sidebar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-sidebar-contact-banner.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar coluna lateral
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index2.html')
          s=p.read_text()
          s=s.replace('height: auto;\n    }\n\n    .sponsor-card {','height: 300px;\n    }\n\n    .sponsor-card {',1)
          s=s.replace('width: var(--side-column);\n      height: auto;\n      overflow: hidden;','width: var(--side-column);\n      height: 300px;\n      overflow: hidden;',1)
          s=s.replace('width: 100%;\n      height: auto;\n      object-fit: contain;\n      user-select: none;\n      -webkit-user-drag: none;\n      filter: brightness(1) saturate(1);','width: 100%;\n      height: 100%;\n      object-fit: contain;\n      user-select: none;\n      -webkit-user-drag: none;\n      filter: brightness(1) saturate(1);',1)

          about_start=s.index('    <section class="about-grid">')
          about_end=s.index('    </section>',about_start)+len('    </section>\n')
          block=s[about_start:about_end]
          a0=block.index('      <article class="about-card">')
          a1=block.index('      </article>',a0)+len('      </article>')
          about=block[a0:a1].replace('      <article','        <article',1)
          c0=block.index('      <article class="contact-card">')
          c1=block.index('      </article>',c0)+len('      </article>')
          contact=block[c0:c1].replace('      <article','        <article',1)
          s=s[:about_start]+s[about_end:]

          main=s.index('    <div class="main-content-grid"')
          left=s.index('      <div class="left-main">',main)
          sched_end=s.index('        </section>',left)+len('        </section>')
          s=s[:sched_end]+'\n\n'+about+s[sched_end:]

          aside=s.index('      <aside class="side-rail"',main)
          aside_end=s.index('      </aside>',aside)
          s=s[:aside_end]+'\n\n'+contact+'\n'+s[aside_end:]
          s=s.replace('aria-label="Acessos, programação e patrocinador"','aria-label="Acessos, programação, patrocinador e contato"',1)
          p.write_text(s)
          PY
      - name: Commitar
        run: |
          rm .github/workflows/adjust-sidebar-contact-banner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ajusta banner e move contato para coluna lateral desktop"
          git push
