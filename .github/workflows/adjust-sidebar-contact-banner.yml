          ampliar a visibilidade das marcas e aproximar empresas de um público presente em mais de 40 cidades.
        </p>
      </article>

      <article class="contact-card">
        <h2>Contato</h2>

        <div class="contact-details">

          <div class="contact-item">
            <span class="contact-label">E-mail</span>
            <a class="contact-value contact-link" href="mailto:amizade@amizade.fm.br">amizade@amizade.fm.br</a>
          </div>

          <div class="contact-item">
            <span class="contact-label">Telefone</span>
            <a class="contact-value contact-link" href="tel:+555135452300">(51) 3545-2300</a>
          </div>

          <div class="contact-item">
            <span class="contact-label">Endereço</span>
            <span class="contact-value">Rua Ernesto Dorneles, 693<br>
              Igrejinha - RS</span>
          </div>

        </div>
      </article>

    </section>
'''

