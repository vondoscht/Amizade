        </p>

        <p>
          Com uma programação popular, de forte audiência e próxima dos seus ouvintes, a Amizade acompanha
          de perto os principais acontecimentos locais e construiu, ao longo de sua história, uma relação
          de confiança e credibilidade com o público.
