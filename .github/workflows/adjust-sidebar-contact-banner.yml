          if old not in s:
              raise SystemExit('Bloco principal esperado não encontrado')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commitar ajuste e remover workflow temporário
        run: |
          rm .github/workflows/adjust-sidebar-contact-banner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ajusta banner e move contato para coluna lateral desktop"
          git push
