name: Criar teste de hover

on:
  push:
    paths:
      - '.github/workflows/teste-hover.yml'

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar cópia sem backdrop-filter
        shell: bash
        run: |
          cp index2.html teste-hover.html
          python - <<'PY'
          from pathlib import Path

          p = Path('teste-hover.html')
          s = p.read_text(encoding='utf-8')

          # Teste controlado: remove somente backdrop-filter e sua versão WebKit.
          lines = []
          for line in s.splitlines():
              if 'backdrop-filter:' in line or '-webkit-backdrop-filter:' in line:
                  continue
              lines.append(line)

          s = '\n'.join(lines) + '\n'
          s = s.replace(
              'transition: background .28s ease, border-color .28s ease, box-shadow .28s ease, backdrop-filter .28s ease, -webkit-backdrop-filter .28s ease, border-radius .28s ease;',
              'transition: background .28s ease, border-color .28s ease, box-shadow .28s ease, border-radius .28s ease;'
          )
          s = s.replace('<title>Amz v1.4</title>', '<title>Amz v1.4</title>')
          s = s.replace('<head>\n', '<head>\n  <!-- TESTE: versão idêntica ao desktop, sem backdrop-filter -->\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit do teste
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/teste-hover.yml
          git add teste-hover.html .github/workflows/teste-hover.yml
          git commit -m "Cria teste de hover sem backdrop-filter"
          git push
