name: Aplicar correção de hover v1.5

on:
  push:
    paths:
      - '.github/workflows/apply-hover-fix-v1-5.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar versão validada sem backdrop-filter
        run: |
          cp teste-hover.html index2.html
          perl -0pi -e 's/  <!-- TESTE: versão idêntica ao desktop, sem backdrop-filter -->\n//' index2.html
          perl -0pi -e 's/<title>Amz v1\.4<\/title>/<title>Amz v1.5<\/title>/' index2.html
          perl -0pi -e 's/<title>Amz v1\.4<\/title>/<title>Amz v1.5<\/title>/' app.html
          rm teste-hover.html
          rm .github/workflows/apply-hover-fix-v1-5.yml

      - name: Commitar v1.5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index2.html app.html teste-hover.html .github/workflows/apply-hover-fix-v1-5.yml
          git commit -m "Amz v1.5 - Corrige hover no Chrome macOS" || exit 0
          git push
