# trigger
name: Fix desktop logo hitbox

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-logo-hitbox.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restringir área clicável do logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index2.html')
          s = p.read_text()
          old = '''    .brand {
      display: flex;
      align-items: center;
      color: #fff;
      text-decoration: none;
      min-width: 0;
    }
'''
          new = '''    .brand {
      display: flex;
      align-items: center;
      justify-self: start;
      width: fit-content;
      max-width: 100%;
      color: #fff;
      text-decoration: none;
      min-width: 0;
    }
'''
          if old not in s:
              raise SystemExit('Bloco .brand esperado não encontrado')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commitar ajuste e remover workflow temporário
        run: |
          rm .github/workflows/fix-logo-hitbox.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige área clicável do logo no cabeçalho desktop"
          git push
