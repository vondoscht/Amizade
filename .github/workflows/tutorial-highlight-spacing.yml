name: Tutorial highlight spacing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tutorial-highlight-spacing.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adicionar respiro de 1px aos destaques amarelos
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.html')
          s = p.read_text()
          old = '''    .install-step__text strong{\n      color:#ffd91a;\n      font-weight:800;\n    }'''
          new = '''    .install-step__text strong{\n      color:#ffd91a;\n      font-weight:800;\n      margin-inline:1px;\n    }'''
          if old not in s:
              raise SystemExit('Regra dos destaques do tutorial não encontrada')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commitar
        run: |
          rm .github/workflows/tutorial-highlight-spacing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ajusta espaçamento dos destaques no tutorial PWA"
          git push
