# trigger 2
name: Apply contact background

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-contact-background.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar imagem ao fundo do contato
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index2.html')
          s = p.read_text()

          pattern = r'''    \.contact-card \{.*?    \.contact-card > \* \{\n      position: relative;\n      z-index: 1;\n    \}\n\n'''
          replacement = '''    .contact-card {
      width: var(--side-column);
      min-width: var(--side-column);
      position: relative;
      overflow: hidden;
      background: url("assets/fundo-contato.svg") center / cover no-repeat;
      border-color: rgba(255,255,255,.18);
      color: #fff;
      box-shadow: 0 18px 38px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.10);
    }

'''
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Bloco do contato não encontrado; substituições: {count}')

          p.write_text(s2)
          PY

      - name: Commitar ajuste e remover workflow temporário
        run: |
          rm .github/workflows/apply-contact-background.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Usa imagem no fundo do card contato"
          git push
