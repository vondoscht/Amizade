name: Fix index title v1.10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-index-title-v1-10.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir título
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index2.html')
          s = p.read_text()
          import re
          s = re.sub(r'<title>Amz v[^<]+</title>', '<title>Amz v1.10</title>', s, count=1)
          p.write_text(s)
          PY
      - name: Commitar
        run: |
          rm .github/workflows/fix-index-title-v1-10.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Amz v1.10 - Alinha título do desktop"
          git push
