name: Restaurar desktop aprovado v1.4

on:
  push:
    paths:
      - '.github/workflows/restore-desktop-v1-4.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar visual desktop aprovado sem iframe
        shell: bash
        run: |
          # Recupera exatamente o desktop aprovado anterior aos ajustes de hover v1.2.
          git show 637d1c533304b7157daa320f057df5125dd2285f:desktop.html > index2.html

          python - <<'PY'
          from pathlib import Path
          import re

          # Únicas mudanças no desktop: versão da aba e redirecionamento mobile.
          p = Path('index2.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<title>.*?</title>', '<title>Amz v1.4</title>', s, count=1, flags=re.S)
          redirect = '''\n  <script>\n    if (window.matchMedia("(max-width: 900px)").matches) {\n      window.location.replace("app.html");\n    }\n  </script>'''
          s = s.replace('<head>', '<head>' + redirect, 1)
          p.write_text(s, encoding='utf-8')

          # Só atualiza o título técnico do app; nenhum CSS/HTML visual é alterado.
          p = Path('app.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<title>.*?</title>', '<title>Amz v1.4</title>', s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')

          Path('README.md').write_text('''# Rádio Amizade — v1.4\n\n- `index2.html` — desktop aprovado original, carregado diretamente, sem iframe.\n- telas de até 900 px são redirecionadas para `app.html`.\n- `app.html` — interface compacta para intermediário/mobile.\n- `assets/` — imagens e ícones.\n\nRegra: o visual desktop não deve ser alterado sem solicitação explícita.\n''', encoding='utf-8')
          PY

          rm -f desktop-hover-v1.2.css desktop.html
          rm -f .github/workflows/restore-desktop-v1-4.yml

      - name: Commit
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Restaura desktop aprovado sem alterações visuais — v1.4"
          git push
