# trigger
name: Reposition desktop contact buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reposition-desktop-contact-buttons.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reorganizar botões do desktop
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index2.html')
          s = p.read_text()

          old_css = '''    .side-rail {
      width: var(--side-column);
      min-width: var(--side-column);
      display: flex;
      flex-direction: column;
      gap: var(--section-gap);
      align-self: start;
    }
'''
          new_css = '''    .side-rail {
      width: var(--side-column);
      min-width: var(--side-column);
      display: flex;
      flex-direction: column;
      gap: var(--section-gap);
      align-self: start;
    }

    .side-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
'''
          if old_css not in s:
              raise SystemExit('Bloco .side-rail esperado não encontrado')
          s = s.replace(old_css, new_css, 1)

          old_html = '''      <div class="left-main">

        <div class="quick-row" aria-label="Acessos rápidos">
          <a class="quick-image" href="https://wa.me/5551998770145" target="_blank" rel="noopener noreferrer" aria-label="Fale com a Rádio Amizade pelo WhatsApp">
            <img src="assets/botao-whatsapp.png" alt="Botão de WhatsApp">
          </a>

          <a class="quick-image" href="https://wa.me/555180527460" target="_blank" rel="noopener noreferrer" aria-label="Anuncie na Rádio Amizade pelo WhatsApp">
            <img src="assets/botao-anuncie.png" alt="Botão Anuncie na Amizade">
          </a>

          <a class="quick-image" href="app.html" aria-label="Abra o aplicativo da Rádio Amizade">
            <img src="assets/botao-iphone.png" alt="Botão Baixe o app para iPhone">
          </a>
        </div>

        <section class="schedule-wrap" id="programacao">'''
          new_html = '''      <div class="left-main">

        <section class="schedule-wrap" id="programacao">'''
          if old_html not in s:
              raise SystemExit('Bloco de acessos rápidos esperado não encontrado')
          s = s.replace(old_html, new_html, 1)

          old_side = '''      <aside class="side-rail" aria-label="Patrocinador">
        <div class="sponsor-wrap">'''
          new_side = '''      <aside class="side-rail" aria-label="Contatos e patrocinador">
        <div class="side-actions" aria-label="Acessos rápidos">
          <a class="quick-image" href="https://wa.me/5551998770145" target="_blank" rel="noopener noreferrer" aria-label="Fale com a Rádio Amizade pelo WhatsApp">
            <img src="assets/botao-whatsapp.png" alt="Botão de WhatsApp">
          </a>

          <a class="quick-image" href="https://wa.me/555180527460" target="_blank" rel="noopener noreferrer" aria-label="Anuncie na Rádio Amizade pelo WhatsApp">
            <img src="assets/botao-anuncie.png" alt="Botão Anuncie na Amizade">
          </a>
        </div>

        <div class="sponsor-wrap">'''
          if old_side not in s:
              raise SystemExit('Bloco lateral esperado não encontrado')
          s = s.replace(old_side, new_side, 1)

          p.write_text(s)
          PY

      - name: Commitar ajuste e remover workflow temporário
        run: |
          rm .github/workflows/reposition-desktop-contact-buttons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reorganiza botões de contato no desktop"
          git push
