# trigger
name: Normalize desktop side gap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-desktop-side-gap.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Igualar espaçamento lateral
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index2.html')
          s = p.read_text()
          old = 'style="grid-template-columns:1fr; gap:14px"'
          new = 'style="grid-template-columns:1fr; gap:var(--section-gap)"'
          if old not in s:
              raise SystemExit('Espaçamento esperado não encontrado')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commitar ajuste e remover workflow temporário
        run: |
          rm .github/workflows/normalize-desktop-side-gap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Iguala espaçamento dos botões laterais no desktop"
          git push
