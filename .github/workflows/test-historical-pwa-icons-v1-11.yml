# trigger do teste
name: Test historical PWA icons v1.11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-historical-pwa-icons-v1-11.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar ícones históricos e aplicar teste
        run: |
          mkdir -p icons
          git show 4658745c302a05369e8684f8347691c78152f342:icons/apple-touch-icon.png > icons/apple-touch-icon.png
          git show 4658745c302a05369e8684f8347691c78152f342:icons/icon-192.png > icons/icon-192.png
          git show 4658745c302a05369e8684f8347691c78152f342:icons/icon-512.png > icons/icon-512.png

          python - <<'PY'
          from pathlib import Path

          app = Path('app.html')
          s = app.read_text()
          s = s.replace('<title>Amz v1.10</title>', '<title>Amz v1.11</title>')

          old = '''  <link rel="icon" type="image/png" href="assets/avatar.png?v=1.10">
  <link rel="apple-touch-icon" href="assets/avatar.png?v=1.10">
  <link rel="apple-touch-icon-precomposed" href="assets/avatar.png?v=1.10">
  <link rel="manifest" href="manifest.webmanifest?v=1.10">'''

          new = '''  <link rel="icon" type="image/png" href="assets/favicon.png?v=1.11">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=1.11">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="icons/apple-touch-icon.png?v=1.11">
  <link rel="manifest" href="manifest.webmanifest?v=1.11">'''

          if old not in s:
              raise SystemExit('Bloco atual de ícones do app não encontrado')
          s = s.replace(old, new)
          app.write_text(s)

          Path('manifest.webmanifest').write_text('''{
  "id": "./app.html",
  "name": "Rádio Amizade",
  "short_name": "Rádio Amizade",
  "description": "Ouça a Rádio Amizade 98.7 FM ao vivo.",
  "lang": "pt-BR",
  "dir": "ltr",
  "start_url": "./app.html?source=pwa",
  "scope": "./",
  "display": "standalone",
  "display_override": ["standalone", "minimal-ui"],
  "orientation": "portrait",
  "background_color": "#111319",
  "theme_color": "#111319",
  "icons": [
    {
      "src": "icons/icon-192.png?v=1.11",
      "sizes": "192x192",
      "type": "image/png",
      "purpose": "any"
    },
    {
      "src": "icons/icon-512.png?v=1.11",
      "sizes": "512x512",
      "type": "image/png",
      "purpose": "any"
    }
  ]
}
''')

          sw = Path('service-worker.js')
          w = sw.read_text()
          w = w.replace('const CACHE_NAME = "radio-amizade-mobile-v1.10";', 'const CACHE_NAME = "radio-amizade-mobile-v1.11";')
          start = w.index('const APP_SHELL = [')
          end = w.index('];', start) + 2
          shell = '''const APP_SHELL = [
  "./app.html",
  "./manifest.webmanifest?v=1.11",
  "./assets/avatar.png?v=1.11",
  "./assets/favicon.png?v=1.11",
  "./assets/icone-instagram.svg",
  "./assets/icone-facebook.svg",
  "./assets/icone-youtube.svg",
  "./assets/icone-whatsapp.svg",
  "./icons/apple-touch-icon.png?v=1.11",
  "./icons/icon-192.png?v=1.11",
  "./icons/icon-512.png?v=1.11"
];'''
          w = w[:start] + shell + w[end:]
          sw.write_text(w)

          index = Path('index2.html')
          i = index.read_text().replace('<title>Amz v1.10</title>', '<title>Amz v1.11</title>')
          index.write_text(i)
          PY

      - name: Commitar teste e remover workflow temporário
        run: |
          rm .github/workflows/test-historical-pwa-icons-v1-11.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Amz v1.11 - Testa ícones históricos do PWA"
          git push
