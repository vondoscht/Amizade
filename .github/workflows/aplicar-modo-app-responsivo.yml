name: Aplicar modo app responsivo

on:
  push:
    paths:
      - '.github/workflows/aplicar-modo-app-responsivo.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fazer index2 usar o app em telas ate 900px
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index2.html')
          html = path.read_text(encoding='utf-8')

          css = '''

    /* Modo app para tablet/intermediario e mobile */
    .responsive-app-frame {
      display: none;
    }

    @media (max-width: 900px) {
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111319;
      }

      .site {
        display: none !important;
      }

      .responsive-app-frame {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 9999;
        width: 100%;
        height: 100vh;
        height: 100svh;
        border: 0;
        margin: 0;
        padding: 0;
        background: #111319;
      }
    }
'''

          frame = '''

  <iframe
    class="responsive-app-frame"
    src="app.html"
    title="Rádio Amizade"
    allow="autoplay"
    loading="eager"
  ></iframe>
'''

          if '.responsive-app-frame {' not in html:
              html = html.replace('  </style>\n</head>', css + '\n  </style>\n</head>', 1)

          if 'class="responsive-app-frame"' not in html:
              html = html.replace('  </main>\n\n  <script src=', '  </main>' + frame + '\n  <script src=', 1)

          # Evita que o player desktop seja inicializado por baixo do app.
          if 'if (window.matchMedia("(min-width: 901px)").matches)' not in html:
              html = html.replace(
                  '    setupStream();',
                  '    if (window.matchMedia("(min-width: 901px)").matches) {\n      setupStream();\n    }',
                  1
              )

          path.write_text(html, encoding='utf-8')
          PY

      - name: Salvar alteracao
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index2.html
          git diff --cached --quiet && exit 0
          git commit -m "Exibir app em telas intermediarias e mobile"
          git push
