<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111319">
  <title>Amz v1.3</title>

  <link rel="icon" type="image/png" href="assets/avatar.png">
  <link rel="apple-touch-icon" href="assets/avatar.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://5a2b083e9f360.streamlock.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#111319;
      --panel:rgba(29,32,39,.90);
      --yellow:#ffd91a;
      --red:#a9001a;
      --cover:min(64vw,255px);
      --top:7svh;
      --cover-y:22svh;
      --title-gap:22px;
      --eq-gap:16px;
      --menu-gap:48px;
      --menu-h:76px;
      --play:98px;
      --social:42px;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    html,body{
      margin:0;
      min-width:320px;
      min-height:100%;
      background:#111319;
      color:#fff;
    }

    body{
      min-height:100vh;
      min-height:100svh;
      overflow:hidden;
      font-family:"Manrope",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 15% 8%,rgba(214,27,67,.12),transparent 32%),
        radial-gradient(circle at 85% 55%,rgba(70,75,95,.10),transparent 38%),
        #111319;
    }

    button,a{font:inherit;touch-action:manipulation}
    button{border:0;padding:0;-webkit-appearance:none;appearance:none}

    .app{
      position:relative;
      width:min(100%,480px);
      height:100vh;
      height:100svh;
      margin:auto;
      overflow:hidden;
    }

    .site-link{
      position:absolute;
      z-index:20;
      top:var(--top);
      left:50%;
      transform:translateX(-50%);
      padding:8px 16px;
      border-radius:999px;
      color:rgba(255,255,255,.82);
      background:rgba(29,32,39,.82);
      box-shadow:0 10px 24px rgba(0,0,0,.18);
      font-size:14px;
      font-weight:700;
      line-height:1;
      text-decoration:none;
      white-space:nowrap;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .cover{
      position:absolute;
      top:var(--cover-y);
      left:50%;
      transform:translateX(-50%);
      width:var(--cover);
      aspect-ratio:1;
      overflow:hidden;
      border-radius:28px;
      background:#ffd91a;
      box-shadow:0 24px 40px rgba(255,217,26,.18);
    }

    .cover img{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    h1{
      position:absolute;
      top:calc(var(--cover-y) + var(--cover) + var(--title-gap));
      left:50%;
      transform:translateX(-50%);
      margin:0;
      font-size:19px;
      font-weight:700;
      line-height:1.15;
      letter-spacing:-.4px;
      white-space:nowrap;
    }

    .waves{
      position:absolute;
      top:calc(var(--cover-y) + var(--cover) + var(--title-gap) + 22px + var(--eq-gap));
      left:50%;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      gap:5px;
      height:34px;
      opacity:0;
      visibility:hidden;
    }

    .playing .waves{
      opacity:1;
      visibility:visible;
    }

    .waves i{
      width:5px;
      border-radius:999px;
      background:var(--yellow);
      animation:wave .9s infinite ease-in-out;
    }
    .waves i:nth-child(1){height:22px}
    .waves i:nth-child(2){height:34px;animation-delay:.1s}
    .waves i:nth-child(3){height:24px;animation-delay:.2s}
    .waves i:nth-child(4){height:34px;animation-delay:.3s}
    .waves i:nth-child(5){height:22px;animation-delay:.4s}

    @keyframes wave{50%{transform:scaleY(.55);opacity:.65}}

    .menu{
      position:absolute;
      top:min(
        calc(var(--cover-y) + var(--cover) + var(--title-gap) + 22px + var(--eq-gap) + 34px + var(--menu-gap)),
        calc(100% - var(--menu-h) - 24px - env(safe-area-inset-bottom))
      );
      left:22px;
      right:22px;
      height:var(--menu-h);
      display:flex;
      align-items:center;
      justify-content:space-evenly;
      overflow:visible;
      border:1px solid rgba(255,255,255,.08);
      border-radius:22px;
      background:var(--panel);
      box-shadow:0 16px 34px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.05);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
    }

    .social{
      flex:0 0 var(--social);
      width:var(--social);
      height:var(--social);
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.08);
      border-radius:50%;
      background:linear-gradient(180deg,#23262e,#1d2027);
      text-decoration:none;
    }

    .social img{
      width:20px;
      height:20px;
      object-fit:contain;
    }

    .play{
      flex:0 0 var(--play);
      width:var(--play);
      height:var(--play);
      display:grid;
      place-items:center;
      border-radius:50%;
      color:var(--yellow);
      background:linear-gradient(180deg,#d61b43,var(--red));
      box-shadow:0 20px 38px rgba(239,35,71,.32),inset 0 1px rgba(255,255,255,.10);
      cursor:pointer;
    }

    .play:active,.social:active{transform:scale(.95)}

    .play svg{width:31px;height:36px}
    .play-triangle{position:relative;left:2px}
    .pause{display:none}
    .playing .play-triangle{display:none}
    .playing .pause{display:block}

    @media(max-width:380px){
      .menu{left:14px;right:14px}
      h1{font-size:18px}
    }

    @media(max-width:340px){
      :root{--play:84px;--social:38px}
      .social img{width:18px;height:18px}
    }

    @media(max-height:720px){
      :root{--title-gap:18px;--eq-gap:12px;--menu-gap:34px}
    }

    @media(max-height:640px){
      :root{--cover:min(58vw,215px);--title-gap:16px;--eq-gap:10px;--menu-gap:26px}
    }

    @media(prefers-reduced-motion:reduce){
      .waves i{animation:none}
    }
  </style>
</head>

<body>
  <main class="app" id="app">
    <a class="site-link" href="https://amizade.fm.br/">amizade.fm.br</a>

    <div class="cover">
      <img src="assets/avatar.png" alt="Rádio Amizade">
    </div>

    <h1>Rádio Amizade 98.7 FM</h1>

    <div class="waves" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i>
    </div>

    <nav class="menu" aria-label="Rádio Amizade">
      <a class="social" href="https://www.instagram.com/radioamizade/" target="_blank" rel="noopener" aria-label="Instagram">
        <img src="assets/icone-instagram.svg" alt="">
      </a>

      <a class="social" href="https://www.facebook.com/RadioAmizadeFM98.7" target="_blank" rel="noopener" aria-label="Facebook">
        <img src="assets/icone-facebook.svg" alt="">
      </a>

      <button class="play" id="play" type="button" aria-label="Ouvir Rádio Amizade">
        <svg class="play-triangle" viewBox="0 0 36 38" aria-hidden="true">
          <path fill="currentColor" d="M5 2Q3 1 3 5v28q0 4 4 2l24-14q3-2 0-4L7 3Q6 2 5 2Z"/>
        </svg>
        <svg class="pause" viewBox="0 0 36 38" aria-hidden="true">
          <rect x="7" y="5" width="8" height="28" rx="3" fill="currentColor"/>
          <rect x="21" y="5" width="8" height="28" rx="3" fill="currentColor"/>
        </svg>
      </button>

      <a class="social" href="https://www.youtube.com/@RadioAmizade98.7" target="_blank" rel="noopener" aria-label="YouTube">
        <img src="assets/icone-youtube.svg" alt="">
      </a>

      <a class="social" href="https://wa.me/5551998770145" target="_blank" rel="noopener" aria-label="WhatsApp">
        <img src="assets/icone-whatsapp.svg" alt="">
      </a>
    </nav>

    <audio id="audio" preload="auto" playsinline></audio>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    (() => {
      const STREAM = "https://5a2b083e9f360.streamlock.net/amizadefm/amizadefm.stream/playlist.m3u8";
      const app = document.getElementById("app");
      const audio = document.getElementById("audio");
      const button = document.getElementById("play");
      let hls = null;
      let ready = false;
      let pendingPlay = false;

      function setPlaying(value) {
        app.classList.toggle("playing", value);
        button.setAttribute("aria-label", value ? "Pausar Rádio Amizade" : "Ouvir Rádio Amizade");
      }

      function seekToLiveEdge() {
        if (hls && Number.isFinite(hls.liveSyncPosition) && hls.liveSyncPosition > 0) {
          try { audio.currentTime = hls.liveSyncPosition; } catch (_) {}
          return;
        }

        if (audio.seekable && audio.seekable.length) {
          const last = audio.seekable.length - 1;
          const end = audio.seekable.end(last);
          const start = audio.seekable.start(last);
          const target = Math.max(start, end - 0.15);
          if (Number.isFinite(target)) {
            try { audio.currentTime = target; } catch (_) {}
          }
        }
      }

      function play() {
        seekToLiveEdge();
        audio.play().catch(() => setPlaying(false));
      }

      // Safari/iPhone/iPad/macOS: HLS nativo e pré-carregado.
      if (audio.canPlayType("application/vnd.apple.mpegurl")) {
        audio.preload = "auto";
        audio.src = STREAM;
        audio.load();
        ready = true;
      }
      // Chrome/Android/desktop: hls.js começa a carregar assim que a página abre.
      else if (window.Hls && Hls.isSupported()) {
        hls = new Hls({
          lowLatencyMode: false,
          liveSyncDurationCount: 1,
          liveMaxLatencyDurationCount: 3,
          initialLiveManifestSize: 1,
          maxBufferLength: 4,
          maxMaxBufferLength: 8,
          backBufferLength: 0,
          startFragPrefetch: true
        });
        hls.loadSource(STREAM);
        hls.attachMedia(audio);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          ready = true;
          if (pendingPlay) {
            pendingPlay = false;
            play();
          }
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (!data.fatal) return;
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            hls.startLoad();
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
          }
        });
      } else {
        button.disabled = true;
        button.setAttribute("aria-label", "Áudio indisponível neste navegador");
      }

      button.addEventListener("click", () => {
        if (!audio.paused) {
          audio.pause();
          pendingPlay = false;
          return;
        }

        if (ready) play();
        else pendingPlay = true;
      });

      audio.addEventListener("loadedmetadata", seekToLiveEdge);
      audio.addEventListener("canplay", () => {
        ready = true;
        if (pendingPlay) {
          pendingPlay = false;
          play();
        }
      }, { once: true });
      audio.addEventListener("playing", () => setPlaying(true));
      audio.addEventListener("pause", () => setPlaying(false));
      audio.addEventListener("ended", () => setPlaying(false));
      audio.addEventListener("error", () => setPlaying(false));
    })();
  </script>
</body>
</html>
