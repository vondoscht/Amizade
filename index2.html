<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111319">
  <title>Amz v1.2</title>
  <meta name="description" content="Ouça a Rádio Amizade 98.7 FM ao vivo.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/avatar.png">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111319;
    }

    #siteView {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100svh;
      border: 0;
      margin: 0;
      padding: 0;
      background: #111319;
    }
  </style>
</head>
<body>
  <iframe
    id="siteView"
    title="Rádio Amizade"
    allow="autoplay"
  ></iframe>

  <script>
    (() => {
      const frame = document.getElementById("siteView");
      const mobile = window.matchMedia("(max-width: 900px)");

      function aplicarHoverDesktop() {
        if (frame.dataset.destino !== "desktop.html") return;

        try {
          const doc = frame.contentDocument;
          if (!doc || !doc.head || doc.getElementById("desktop-hover-v12")) return;

          const link = doc.createElement("link");
          link.id = "desktop-hover-v12";
          link.rel = "stylesheet";
          link.href = "desktop-hover-v1.2.css";
          doc.head.appendChild(link);
          doc.title = "Amz v1.2";
        } catch (_) {}
      }

      function carregarVersao() {
        const destino = mobile.matches ? "app.html" : "desktop.html";
        if (frame.dataset.destino === destino) return;
        frame.dataset.destino = destino;
        frame.src = destino;
      }

      frame.addEventListener("load", aplicarHoverDesktop);
      carregarVersao();

      if (mobile.addEventListener) {
        mobile.addEventListener("change", carregarVersao);
      } else if (mobile.addListener) {
        mobile.addListener("change", carregarVersao);
      }
    })();
  </script>
</body>
</html>
