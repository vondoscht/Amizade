<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111319">
  <title>Rádio Amizade 98.7 FM — v1.1</title>
  <meta name="description" content="Ouça a Rádio Amizade 98.7 FM ao vivo.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/avatar.png">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111319;
    }

    #siteView {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100svh;
      border: 0;
      margin: 0;
      padding: 0;
      background: #111319;
    }
  </style>
</head>
<body>
  <iframe
    id="siteView"
    title="Rádio Amizade"
    allow="autoplay"
  ></iframe>

  <script>
    (() => {
      const frame = document.getElementById("siteView");
      const mobile = window.matchMedia("(max-width: 900px)");

      function carregarVersao() {
        const destino = mobile.matches ? "app.html" : "desktop.html";
        if (frame.dataset.destino === destino) return;
        frame.dataset.destino = destino;
        frame.src = destino;
      }

      carregarVersao();

      if (mobile.addEventListener) {
        mobile.addEventListener("change", carregarVersao);
      } else if (mobile.addListener) {
        mobile.addListener(carregarVersao);
      }
    })();
  </script>
</body>
</html>
