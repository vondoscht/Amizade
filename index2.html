  <style>
    :root {
      --gray-900: #111319;
      --gray-850: #171920;
      --gray-800: #1d2027;
      --gray-750: #23262e;
      --gray-700: #2a2d36;
      --yellow: #ffd91a;
      --red: #ef2347;
      --radius-container: 12px;
      --radius-control: 14px;
      --radius-inner: 10px;
      --radius-pill: 999px;
      --font-display: 800;
      --font-title: 700;
      --font-meta: 500;
      --side-column: 300px;
      --shadow: 0 22px 60px rgba(0,0,0,.18);
      --section-gap: 24px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 15% 8%, rgba(214,27,67,.12) 0%, transparent 32%),radial-gradient(circle at 85% 55%, rgba(70,75,95,.10) 0%, transparent 38%),var(--gray-900);
      color: #202020;
    }

    button,a {
      font: inherit;
    }

    .site {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 14px 0 42px;
    }

    .topbar {
      position: sticky;
      top: 14px;
      z-index: 30;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto var(--side-column);
      align-items: center;
      gap: 14px;
      width: calc(100% + 48px);
      margin-left: -24px;
      min-height: 132px;
      padding: 14px 24px;
      border: 1px solid transparent;
      border-radius: var(--radius-container);
      background: transparent;
      box-shadow: none;
      transition: background .28s ease, border-color .28s ease, box-shadow .28s ease, border-radius .28s ease;
    }

    .topbar.scrolled {
      background: rgba(18,19,23,.90);
      border-color: rgba(255,255,255,.08);
      border-radius: 12px;
      box-shadow: 0 16px 42px rgba(0,0,0,.22);
    }

    .brand {
      display: flex;
      align-items: center;
      color: #fff;
      text-decoration: none;
      min-width: 0;
    }

    .brand-picture {
      display: block;
      line-height: 0;
    }

    .brand-image {
      display: block;
      width: auto;
      height: 90px;
      max-width: 344px;
      object-fit: contain;
      object-position: left center;
      user-select: none;
      -webkit-user-drag: none;
    }

    .socials {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .social {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-control);
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg,var(--gray-800) 0%, var(--gray-850) 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 8px 18px rgba(0,0,0,.14);
      transition: background .22s ease, border-color .22s ease, box-shadow .22s ease;
    }

    .social img {
      display: block;
      width: 22px;
      height: 22px;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .social:hover {
      transform: none;
      background: linear-gradient(180deg,var(--gray-750) 0%,var(--gray-800) 100%);
      border-color: rgba(255,255,255,.24);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 8px 18px rgba(0,0,0,.14), 0 0 16px rgba(255,255,255,.10);
    }

    .social:active {
      transform: none;
      background: linear-gradient(180deg,var(--gray-800) 0%,var(--gray-850) 100%);
      border-color: rgba(255,255,255,.10);
    }

    .live-btn {
      width: var(--side-column);
      min-width: var(--side-column);
      justify-self: stretch;
      height: 84px;
      border: 0;
      border-radius: var(--radius-container);
      overflow: hidden;
      padding: 0;
      cursor: default;
      color: #fff;
      display: grid;
      grid-template-columns: 84px 1fr;
      background: linear-gradient(180deg,#ff0f57 0%, #ff004b 100%);
      box-shadow: 0 12px 28px rgba(239,35,71,.24), 0 0 0 1px rgba(255,255,255,.04) inset;
    }

    .live-btn .icon {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      border: 0;
      padding: 0;
      margin: 0;
      cursor: pointer;
      background: linear-gradient(180deg,#d61b43 0%, #a9001a 100%);
      color: var(--yellow);
      box-shadow: inset -1px 0 0 rgba(255,255,255,.04);
      transition: background .32s cubic-bezier(.22,.61,.36,1), filter .32s cubic-bezier(.22,.61,.36,1), box-shadow .32s cubic-bezier(.22,.61,.36,1);
    }

    .live-btn .icon:hover {
      background: linear-gradient(180deg,#e42a50 0%, #bd0624 100%);
      filter: brightness(1.035) saturate(1.025);
      box-shadow: inset -1px 0 0 rgba(255,255,255,.07);
    }

    .live-btn .icon:hover .play-shape {
      transform: scale(1.08);
    }

    .live-btn .icon:active {
      background: linear-gradient(180deg,#cf173b 0%, #980016 100%);
      filter: brightness(.99);
    }

    .live-btn .icon:active .play-shape {
      transform: scale(.93);
    }

    .live-btn .icon:focus-visible {
      outline: 2px solid rgba(255,217,26,.9);
      outline-offset: -4px;
    }

    .play-shape {
      width: 34px;
      height: 38px;
      margin-left: 4px;
      background: currentColor;
      clip-path: path("M 5 2 Q 3 1 3 5 L 3 33 Q 3 37 7 35 L 31 21 Q 34 19 31 17 L 7 3 Q 6 2 5 2 Z");
      -webkit-clip-path: path("M 5 2 Q 3 1 3 5 L 3 33 Q 3 37 7 35 L 31 21 Q 34 19 31 17 L 7 3 Q 6 2 5 2 Z");
      transform: scale(1);
      transform-origin: center;
      transition: transform .26s cubic-bezier(.22,.61,.36,1);
    }

    @supports not (clip-path: path("M 0 0 L 1 1 Z")) {
      .play-shape {
        width: 0;
        height: 0;
        background: transparent;
        border-top: 17px solid transparent;
        border-bottom: 17px solid transparent;
        border-left: 28px solid currentColor;
        margin-left: 5px;
      }
    }

    .pause-shape {
      display: none;
      width: 26px;
      height: 30px;
      position: relative;
    }

    .pause-shape:before,.pause-shape:after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 8px;
      border-radius: 2px;
      background: currentColor;
    }

    .pause-shape:before {
      left: 2px;
    }

    .pause-shape:after {
      right: 2px;
    }

    .live-btn.playing .play-shape {
      display: none;
    }

    .live-btn.playing .pause-shape {
      display: block;
    }

    .live-copy {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      padding: 0 18px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -.2px;
      white-space: nowrap;
      text-align: left;
      min-width: 0;
      overflow: hidden;
    }

    .live-text {
      display: block;
      text-align: left;
      font-family: "Manrope", ui-sans-serif, system-ui, sans-serif;
      font-weight: 800;
      letter-spacing: -.35px;
    }

    .waves {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 26px;
      flex: 0 0 auto;
      opacity: 0;
      visibility: hidden;
      transform: scaleX(.86);
      transform-origin: left center;
      transition: opacity .22s ease, transform .22s ease, visibility 0s linear .22s;
    }

    .live-btn.playing .waves {
      opacity: 1;
      visibility: visible;
      transform: scaleX(1);
      transition: opacity .22s ease, transform .22s ease, visibility 0s linear 0s;
    }

    .waves i {
      width: 5px;
      border-radius: var(--radius-pill);
      background: var(--yellow);
      animation: wave .9s infinite ease-in-out;
    }

    .waves i:nth-child(1) {
      height: 14px;
    }

    .waves i:nth-child(2) {
      height: 24px;
      animation-delay: .1s;
    }

    .waves i:nth-child(3) {
      height: 18px;
      animation-delay: .2s;
    }

    .waves i:nth-child(4) {
      height: 24px;
      animation-delay: .3s;
    }

    .waves i:nth-child(5) {
      height: 14px;
      animation-delay: .4s;
    }

    @keyframes wave {
      50% { transform: scaleY(.55); opacity: .65; }
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--side-column);
      gap: 18px;
      align-items: stretch;
      margin-top: 8px;
    }

    .hero-main {
      overflow: hidden;
      border-radius: var(--radius-container);
      background: var(--gray-800);
      box-shadow: var(--shadow);
    }

    .hero-carousel {
      position: relative;
      overflow: hidden;
      height: 100%;
      min-height: 330px;
    }

    .hero-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform .55s cubic-bezier(.22,.61,.36,1);
    }

    .hero-slide {
      min-width: 100%;
      height: 100%;
    }

    .hero-slide img {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 330px;
      object-fit: cover;
    }

    .hero-dots {
      position: absolute;
      left: 18px;
      bottom: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 7px 9px;
      border-radius: var(--radius-pill);
      background: rgba(17,19,25,.68);
    }

    .dot {
      width: 9px;
      height: 9px;
      border: 0;
      padding: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.38);
      cursor: pointer;
    }

    .dot.active {
      background: var(--yellow);
    }

    .hero-side {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .quick-image {
      display: block;
      overflow: hidden;
      border-radius: var(--radius-container);
      background: var(--gray-800);
      box-shadow: 0 12px 26px rgba(0,0,0,.10);
      transition: transform .24s ease, box-shadow .24s ease;
    }

    .quick-image img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 1;
      object-fit: cover;
      transition: filter .24s ease;
    }

    .quick-image:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 26px rgba(0,0,0,.10), 0 0 18px rgba(255,255,255,.09);
    }

    .quick-image:hover img {
      filter: brightness(1.05) saturate(1.14) contrast(1.04);
    }

    .quick-image:active {
      transform: translateY(-1px);
    }

    .section {
      margin-top: var(--section-gap);
    }

    .section-title {
      margin: 0 0 14px;
      color: #fff;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .schedule {
      padding: 22px;
      border-radius: var(--radius-container);
      background: linear-gradient(180deg,#be0032 0%, #8e001f 100%);
      box-shadow: var(--shadow);
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7,minmax(0,1fr));
      gap: 8px;
      margin-bottom: 16px;
    }

    .day-tab {
      min-height: 46px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px;
      padding: 0 10px;
      color: #fff;
      background: rgba(255,255,255,.08);
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .day-tab:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,.17);
      border-color: rgba(255,255,255,.28);
      box-shadow: 0 12px 24px rgba(37,0,22,.17), inset 0 1px 0 rgba(255,255,255,.14);
      filter: none;
    }

    .day-tab.active {
      color: #111319;
      background: var(--yellow);
      border-color: var(--yellow);
      box-shadow: 0 8px 18px rgba(255,217,26,.20);
    }

    .programs {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 10px;
    }

    .program {
      min-height: 92px;
      padding: 15px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 12px;
      background: #fff;
      color: #202020;
      box-shadow: 0 8px 18px rgba(37,0,22,.10);
      transition: background .2s ease;
    }

    .program:hover {
      background: #ffe2ec;
    }

    .program-time {
      display: block;
      margin-bottom: 5px;
      color: #9e0022;
      font-size: 13px;
      font-weight: 800;
    }

    .program-name {
      display: block;
      font-size: 15px;
      line-height: 1.25;
      font-weight: 800;
    }

    .sponsor-card {
      display: block;
      overflow: hidden;
      border-radius: var(--radius-container);
      background: #fff;
      box-shadow: 0 12px 28px rgba(0,0,0,.12);
    }

    .sponsor-card img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      transition: filter .24s ease;
    }

    .sponsor-card:hover {
      transform: none;
    }

    .sponsor-card:hover img {
      filter: brightness(1.05) saturate(1.14);
    }

    .contact-card {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 14px;
      padding: 22px;
      border-radius: var(--radius-container);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .contact-item {
      padding: 14px;
      border: 1px solid #ececf0;
      border-radius: 12px;
      background: #f8f8fa;
    }

    .contact-label {
      display: block;
      margin-bottom: 4px;
      color: #777b84;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .contact-link,
    .contact-value {
      color: #20242c;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
      text-decoration: none;
    }

    .contact-link:hover {
      color: #20242c;
    }

    .footer {
      margin-top: 24px;
      padding: 20px 4px 0;
      color: rgba(255,255,255,.58);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 900px) {
      .site {
        width: min(100% - 20px, 720px);
        padding-top: 10px;
      }

      .topbar {
        position: static;
        width: 100%;
        margin-left: 0;
        grid-template-columns: 1fr;
        min-height: auto;
        padding: 0;
      }

      .socials {
        justify-content: center;
      }

      .live-btn {
        width: 100%;
        min-width: 0;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .hero-side {
        grid-template-columns: repeat(3,minmax(0,1fr));
      }

      .days {
        grid-template-columns: repeat(4,minmax(0,1fr));
      }

      .programs {
        grid-template-columns: repeat(2,minmax(0,1fr));
      }
    }

    @media (max-width: 580px) {
      .brand-image {
        height: auto;
        width: min(100%,310px);
      }

      .hero-side {
        grid-template-columns: 1fr;
      }

      .days,
      .programs,
      .contact-card {
        grid-template-columns: 1fr;
      }

      .section-title {
        font-size: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <audio id="radioAudio" preload="none" playsinline></audio>

  <div class="site">
    <header class="topbar" id="topbar">
      <a class="brand" href="#top" aria-label="Rádio Amizade 98.7 FM">
        <picture class="brand-picture">
          <img class="brand-image" src="assets/logo-amizade.png" alt="Rádio Amizade 98.7 FM">
        </picture>
      </a>

      <div class="socials" aria-label="Redes sociais">
        <a class="social" href="https://www.instagram.com/radioamizade/" target="_blank" rel="noopener" aria-label="Instagram">
          <img src="assets/icone-instagram.svg" alt="">
        </a>
        <a class="social" href="https://www.facebook.com/RadioAmizadeFM98.7" target="_blank" rel="noopener" aria-label="Facebook">
          <img src="assets/icone-facebook.svg" alt="">
        </a>
        <a class="social" href="https://www.youtube.com/@RadioAmizade98.7" target="_blank" rel="noopener" aria-label="YouTube">
          <img src="assets/icone-youtube.svg" alt="">
        </a>
      </div>

      <div class="live-btn" id="liveBtn" aria-label="Ouvir Rádio Amizade ao vivo">
        <button class="icon" id="playBtn" type="button" aria-label="Ouvir Rádio Amizade">
          <span class="play-shape" aria-hidden="true"></span>
          <span class="pause-shape" aria-hidden="true"></span>
        </button>
        <div class="live-copy">
          <span class="live-text">Ouça ao vivo</span>
          <span class="waves" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </div>
      </div>
    </header>

    <main id="top">
      <section class="hero" aria-label="Destaques">
        <div class="hero-main">
          <div class="hero-carousel" id="heroCarousel">
            <div class="hero-track" id="heroTrack">
              <div class="hero-slide"><img src="assets/banner-01.png" alt="Destaque Rádio Amizade"></div>
              <div class="hero-slide"><img src="assets/banner-02.png" alt="Destaque Rádio Amizade"></div>
              <div class="hero-slide"><img src="assets/banner-03.png" alt="Destaque Rádio Amizade"></div>
            </div>
            <div class="hero-dots" id="heroDots" aria-label="Navegação dos destaques"></div>
          </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    (() => {
      const streamUrl = "https://5a2b083e9f360.streamlock.net/amizadefm/amizadefm.stream/playlist.m3u8";
      const audio = document.getElementById("radioAudio");
      const liveBtn = document.getElementById("liveBtn");
      const playBtn = document.getElementById("playBtn");
      let hls = null;
      let started = false;

      function setPlaying(isPlaying) {
        liveBtn.classList.toggle("playing", isPlaying);
        playBtn.setAttribute("aria-label", isPlaying ? "Pausar Rádio Amizade" : "Ouvir Rádio Amizade");
      }

      function setupStream() {
        if (started) return;
        started = true;

        if (window.Hls && Hls.isSupported()) {
          hls = new Hls({
            lowLatencyMode: false,
            liveSyncDurationCount: 3,
            initialLiveManifestSize: 3
          });
          hls.loadSource(streamUrl);
          hls.attachMedia(audio);
        } else if (audio.canPlayType("application/vnd.apple.mpegurl")) {
          audio.src = streamUrl;
        }
      }

      playBtn.addEventListener("click", async () => {
        setupStream();
        if (audio.paused) {
          try {
            await audio.play();
          } catch (_) {
            setPlaying(false);
          }
        } else {
          audio.pause();
        }
      });

      audio.addEventListener("playing", () => setPlaying(true));
      audio.addEventListener("pause", () => setPlaying(false));
      audio.addEventListener("ended", () => setPlaying(false));
      audio.addEventListener("error", () => setPlaying(false));
    })();

    (() => {
      const topbar = document.getElementById("topbar");
      const syncTopbar = () => topbar.classList.toggle("scrolled", window.scrollY > 14);
      syncTopbar();
      window.addEventListener("scroll", syncTopbar, { passive: true });
    })();

    (() => {
      const track = document.getElementById("heroTrack");
      const dotsWrap = document.getElementById("heroDots");
      const slides = [...track.children];
      let index = 0;
      let timer = null;

      const dots = slides.map((_,i) => {
        const button = document.createElement("button");
        button.className = "dot";
        button.type = "button";
        button.setAttribute("aria-label", `Ir para destaque ${i + 1}`);
        button.addEventListener("click", () => go(i,true));
        dotsWrap.appendChild(button);
        return button;
      });

      function go(next,userAction=false) {
        index = (next + slides.length) % slides.length;
        track.style.transform = `translateX(-${index * 100}%)`;
        dots.forEach((dot,i) => dot.classList.toggle("active", i === index));
        if (userAction) restart();
      }

      function restart() {
        clearInterval(timer);
        timer = setInterval(() => go(index + 1), 5200);
      }

      go(0);
      restart();
    })();

    (() => {
      const schedules = {
        seg: [
          ["01:00","Show da Madrugada"],["05:00","Bom Dia Amizade"],["07:00","Girando com a Notícia"],["08:00","Sintonia 98 - Manhã"],["10:00","Conexão 98"],["14:00","Sintonia 98 - Tarde"],["18:00","Hora Extra"],["19:00","A Voz do Brasil"],["20:00","Expresso 98"]
        ],
        ter: [
          ["01:00","Show da Madrugada"],["05:00","Bom Dia Amizade"],["07:00","Girando com a Notícia"],["08:00","Sintonia 98 - Manhã"],["10:00","Conexão 98"],["14:00","Sintonia 98 - Tarde"],["18:00","Hora Extra"],["19:00","A Voz do Brasil"],["20:00","Expresso 98"]
        ],
        qua: [
          ["01:00","Show da Madrugada"],["05:00","Bom Dia Amizade"],["07:00","Girando com a Notícia"],["08:00","Sintonia 98 - Manhã"],["10:00","Conexão 98"],["14:00","Sintonia 98 - Tarde"],["18:00","Hora Extra"],["19:00","A Voz do Brasil"],["20:00","Expresso 98"]
        ],
        qui: [
          ["01:00","Show da Madrugada"],["05:00","Bom Dia Amizade"],["07:00","Girando com a Notícia"],["08:00","Sintonia 98 - Manhã"],["10:00","Conexão 98"],["14:00","Sintonia 98 - Tarde"],["18:00","Hora Extra"],["19:00","A Voz do Brasil"],["20:00","Expresso 98"]
        ],
        sex: [
          ["01:00","Show da Madrugada"],["05:00","Bom Dia Amizade"],["07:00","Girando com a Notícia"],["08:00","Sintonia 98 - Manhã"],["10:00","Conexão 98"],["14:00","Sintonia 98 - Tarde"],["18:00","Hora Extra"],["19:00","A Voz do Brasil"],["20:00","Show Clube & Cia"]
        ],
        sab: [
          ["01:00","Show da Madrugada"],["05:00","Bom Dia Amizade"],["06:00","Amizade em Foco"],["07:00","Amizade Rural"],["09:00","Fim de Semana Amizade"],["13:00","Conta Mais"],["14:00","Sintonia 98 - Tarde"],["18:00","Hora Extra"],["20:00","Expresso 98"]
        ],
        dom: [
          ["01:00","Show da Madrugada"],["05:00","Bom Dia Amizade"],["07:00","Amizade Rural"],["09:00","Fim de Semana Amizade"],["13:00","Domingo Amizade"],["18:00","Hora Extra"],["20:00","Expresso 98"]
        ]
      };

      const labels = [
        ["seg","Seg"],["ter","Ter"],["qua","Qua"],["qui","Qui"],["sex","Sex"],["sab","Sáb"],["dom","Dom"]
      ];

      const tabs = document.getElementById("dayTabs");
      const list = document.getElementById("programList");

      const buttons = labels.map(([key,label]) => {
        const button = document.createElement("button");
        button.className = "day-tab";
        button.type = "button";
        button.textContent = label;
        button.dataset.day = key;
        button.setAttribute("role","tab");
        button.addEventListener("click", () => render(key));
        tabs.appendChild(button);
        return button;
      });

      function render(day) {
        buttons.forEach((button) => {
          const active = button.dataset.day === day;
          button.classList.toggle("active",active);
          button.setAttribute("aria-selected",String(active));
        });

        list.innerHTML = schedules[day].map(([time,name]) => `
          <article class="program">
            <span class="program-time">${time}</span>
            <span class="program-name">${name}</span>
          </article>
        `).join("");
      }

      const jsDay = new Date().getDay();
      const defaultKey = ["dom","seg","ter","qua","qui","sex","sab"][jsDay];
      render(defaultKey);
    })();
  </script>
