<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Rádio Amizade</title>

  <meta name="theme-color" content="#111319">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="icon" type="image/png" href="assets/avatar.png?v=8">
  <link rel="manifest" href="manifest.webmanifest?v=8">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-radio-amizade-v8.png">
  <meta name="application-name" content="Rádio Amizade">
  <meta name="apple-mobile-web-app-title" content="Rádio Amizade">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #111319;
      --panel: rgba(29, 32, 39, .90);
      --panel-hover: #2a2d36;
      --red-dark: #a9001a;
      --yellow: #ffd91a;
      --text: #fff;

      --cover-size: min(64vw, 255px);
      --menu-height: 76px;

      --topo-y: 7svh;
      --quadrado-y: 22svh;

      --titulo-gap: 22px;
      --equalizador-gap: 16px;
      --menu-gap: 48px;

      --play-size: 98px;
      --social-size: 42px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      font-family:
        "Manrope",
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 15% 8%,
          rgba(214, 27, 67, .12) 0%,
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 55%,
          rgba(70, 75, 95, .10) 0%,
          transparent 38%
        ),
        var(--bg);
      overflow-x: hidden;
    }

    button,
    a {
      font: inherit;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    button {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      padding: 0;
    }

    /*
      POSICIONAMENTO ROBUSTO PARA MOBILE:
      topo: 5% da altura visível
      quadrado: começa em 22% da altura visível

      A partir do quadrado:
      título: 22px abaixo
      equalizador: 16px abaixo do título
      menu: 48px abaixo do equalizador

      Assim os elementos não entram uns nos outros em iPhones
      com alturas de viewport diferentes.
    */

    .app {
      position: relative;
      width: min(100%, 480px);
      height: 100vh;
      height: 100svh;
      margin-inline: auto;
      overflow: hidden;
    }

    .site-link {
      position: absolute;
      z-index: 30;
      top: var(--topo-y);
      left: 50%;
      transform: translateX(-50%);

      display: block;
      width: max-content;

      padding: 8px 16px;
      border-radius: 999px;

      color: rgba(255, 255, 255, .82);
      background: rgba(29, 32, 39, .82);
      box-shadow: 0 10px 24px rgba(0, 0, 0, .18);

      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }


    .site-link.is-install {
      color: #111319;
      background: #ffd91a;
      cursor: pointer;
    }

    .station {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .station-center {
      width: 100%;
      height: 100%;
      text-align: center;
    }

    .cover {
      position: absolute;
      top: var(--quadrado-y);
      left: 50%;
      transform: translateX(-50%);

      width: var(--cover-size);
      aspect-ratio: 1;

      border-radius: 28px;
      background:
        linear-gradient(
          180deg,
          #ffe64f 0%,
          var(--yellow) 58%,
          #f3c800 100%
        );
      box-shadow: 0 24px 40px rgba(255, 217, 26, .18);
      overflow: hidden;
      isolation: isolate;
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    .station-title {
      position: absolute;
      top: calc(var(--quadrado-y) + var(--cover-size) + var(--titulo-gap));
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      color: var(--text);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -.4px;
      text-align: center;
      white-space: nowrap;
    }

    .waves {
      position: absolute;
      top: calc(
        var(--quadrado-y) +
        var(--cover-size) +
        var(--titulo-gap) +
        22px +
        var(--equalizador-gap)
      );
      left: 50%;
      transform: translateX(-50%) scaleX(.86);
      z-index: 5;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      width: max-content;
      height: 34px;

      opacity: 0;
      visibility: hidden;
      transform-origin: center;
      transition:
        opacity .22s ease,
        transform .22s ease,
        visibility 0s linear .22s;
      pointer-events: none;
    }

    .playing .waves {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scaleX(1);
      transition:
        opacity .22s ease,
        transform .22s ease,
        visibility 0s;
    }

    .waves i {
      display: block;
      width: 5px;
      border-radius: 999px;
      background: var(--yellow);
      animation: wave .9s infinite ease-in-out;
      animation-play-state: paused;
      will-change: transform, opacity;
    }

    .playing .waves i {
      animation-play-state: running;
    }

    .waves i:nth-child(1) { height: 22px; }
    .waves i:nth-child(2) { height: 34px; animation-delay: .1s; }
    .waves i:nth-child(3) { height: 24px; animation-delay: .2s; }
    .waves i:nth-child(4) { height: 34px; animation-delay: .3s; }
    .waves i:nth-child(5) { height: 22px; animation-delay: .4s; }

    @keyframes wave {
      50% {
        transform: scaleY(.55);
        opacity: .65;
      }
    }

    /* Menu: acompanha o bloco central e respeita a área segura inferior. */
    .menu {
      position: absolute;
      top: min(
        calc(
          var(--quadrado-y) +
          var(--cover-size) +
          var(--titulo-gap) +
          22px +
          var(--equalizador-gap) +
          34px +
          var(--menu-gap)
        ),
        calc(100% - var(--menu-height) - 24px - env(safe-area-inset-bottom))
      );
      left: 22px;
      right: 22px;

      display: flex;
      align-items: center;
      justify-content: space-evenly;
      overflow: visible;

      height: var(--menu-height);

      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 22px;
      background: var(--panel);
      box-shadow:
        0 16px 34px rgba(0, 0, 0, .24),
        inset 0 1px 0 rgba(255, 255, 255, .05);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }


    .social-button {
      width: var(--social-size);
      height: var(--social-size);
      flex: 0 0 var(--social-size);

      display: grid;
      place-items: center;

      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 50%;
      background:
        linear-gradient(180deg, #23262e 0%, #1d2027 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);

      text-decoration: none;
      transition:
        transform .16s ease,
        background .16s ease,
        border-color .16s ease;
    }

    .social-button img {
      display: block;
      width: 20px;
      height: 20px;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .social-button:active {
      transform: scale(.92);
    }

    .play-button {
      position: relative;
      z-index: 10;
      flex: 0 0 var(--play-size);
      transform: none;

      width: var(--play-size);
      height: var(--play-size);

      display: grid;
      place-items: center;

      border-radius: 50%;
      color: var(--yellow);
      background:
        linear-gradient(180deg, #d61b43 0%, var(--red-dark) 100%);
      box-shadow:
        0 20px 38px rgba(239, 35, 71, .32),
        inset 0 1px 0 rgba(255, 255, 255, .10);

      cursor: pointer;
      transition:
        transform .16s ease,
        filter .16s ease;
    }

    .play-button:active {
      transform: scale(.95);
      filter: brightness(.97);
    }

    .play-button:disabled {
      cursor: wait;
      opacity: .72;
    }

    .play-icon,
    .pause-icon {
      width: 30px;
      height: 34px;
    }

    .play-icon {
      margin-left: 4px;
    }

    .pause-icon {
      display: none;
    }

    .playing .play-icon {
      display: none;
    }

    .playing .pause-icon {
      display: block;
    }

    .play-button:focus-visible,
    .social-button:focus-visible,
    .site-link:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 4px;
    }

    @media (hover: hover) {
      .site-link:hover {
        color: #fff;
      }

      .social-button:hover {
        background:
          linear-gradient(
            180deg,
            var(--panel-hover) 0%,
            #23262e 100%
          );
        border-color: rgba(255, 255, 255, .18);
      }
    }

    /*
      Somente ajustes HORIZONTAIS para aparelhos estreitos.
      Nenhuma regra abaixo muda a posição vertical dos blocos principais.
    */
    @media (max-width: 380px) {
      .menu {
        left: 14px;
        right: 14px;
      }

      .station-title {
        font-size: 18px;
      }
    }

    @media (max-width: 340px) {
      :root {
        --play-size: 84px;
        --social-size: 38px;
      }

      .social-button img {
        width: 18px;
        height: 18px;
      }

      .play-icon,
      .pause-icon {
        width: 27px;
        height: 30px;
      }
    }

    @media (max-height: 720px) {
      :root {
        --titulo-gap: 18px;
        --equalizador-gap: 12px;
        --menu-gap: 34px;
      }
    }

    @media (max-height: 640px) {
      :root {
        --cover-size: min(58vw, 215px);
        --titulo-gap: 16px;
        --equalizador-gap: 10px;
        --menu-gap: 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .waves i {
        animation: none !important;
      }
    }
  

    .install-sheet[hidden] {
      display: none;
    }

    .install-sheet {
      position: fixed;
      z-index: 200;
      inset: 0;

      display: grid;
      place-items: end center;

      padding:
        20px
        16px
        calc(16px + env(safe-area-inset-bottom));

      background: rgba(0, 0, 0, .46);
    }

    .install-sheet__card {
      width: min(100%, 430px);
      padding: 20px;

      border: 1px solid rgba(255, 255, 255, .10);
      border-radius: 24px;

      color: #fff;
      background: #1d2027;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .42);
    }

    .install-sheet__card h2 {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.2;
    }

    .install-sheet__card p {
      margin: 0;
      color: rgba(255, 255, 255, .78);
      font-size: 14px;
      line-height: 1.5;
    }

    .install-sheet__card strong {
      color: #ffd91a;
    }

    .install-sheet__close {
      width: 100%;
      min-height: 46px;
      margin-top: 18px;

      border-radius: 15px;
      color: #111319;
      background: #ffd91a;

      font-weight: 800;
      cursor: pointer;
    }


  </style>
</head>

<body>
  <main class="app" id="app">
    <a
      class="site-link"
      id="siteLink"
      href="https://amizade.fm.br/"
      target="_blank"
      rel="noopener noreferrer"
    >
      amizade.fm.br
    </a>

    <section class="station" aria-label="Player da Rádio Amizade">
      <div class="station-center">
        <div class="cover">
          <img
            src="assets/avatar.png"
            alt="Símbolo da Rádio Amizade"
            width="1080"
            height="1080"
            decoding="async"
          >
        </div>

        <h1 class="station-title">Rádio Amizade 98.7 FM</h1>

        <span class="waves" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </span>
      </div>

      <nav class="menu" aria-label="Redes sociais e player">
        <a
          class="social-button"
          href="https://www.instagram.com/radioamizade/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
        >
          <img src="assets/icone-instagram.svg" alt="">
        </a>

        <a
          class="social-button"
          href="https://www.facebook.com/RadioAmizadeFM98.7"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Facebook"
        >
          <img src="assets/icone-facebook.svg" alt="">
        </a>

        <button
          class="play-button"
          id="playButton"
          type="button"
          aria-label="Ouvir Rádio Amizade ao vivo"
          aria-pressed="false"
        >
          <svg class="play-icon" viewBox="0 0 34 38" aria-hidden="true">
            <path
              fill="currentColor"
              d="M5 2Q3 1 3 5v28q0 4 4 2l24-14q3-2 0-4L7 3Q6 2 5 2Z"
            />
          </svg>

          <svg class="pause-icon" viewBox="0 0 30 34" aria-hidden="true">
            <rect x="4" y="2" width="8" height="30" rx="2" fill="currentColor"/>
            <rect x="18" y="2" width="8" height="30" rx="2" fill="currentColor"/>
          </svg>
        </button>

        <a
          class="social-button"
          href="https://www.youtube.com/@RadioAmizade98.7"
          target="_blank"
          rel="noopener noreferrer"

        >
          <img src="assets/icone-youtube.svg" alt="">
        </a>

        <a
          class="social-button"
          href="https://wa.me/5551998770145"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="WhatsApp da Rádio Amizade"
        >
          <img src="assets/icone-whatsapp.svg" alt="">
        </a>
      </nav>

      <audio id="radioStream" preload="auto" playsinline></audio>
    </section>
  </main>

  <div
    class="install-sheet"
    id="installSheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="installSheetTitle"
    hidden
  >
    <div class="install-sheet__card">
      <h2 id="installSheetTitle">Adicionar à Tela de Início</h2>
      <p>
        No iPhone, toque em <strong>Compartilhar</strong> no Safari e escolha
        <strong>Adicionar à Tela de Início</strong>.
      </p>
      <button
        class="install-sheet__close"
        id="installSheetClose"
        type="button"
      >
        Entendi
      </button>
    </div>
  </div>


  <script>
    (() => {
      "use strict";

      const siteLink = document.getElementById("siteLink");
      const installSheet = document.getElementById("installSheet");
      const installSheetClose = document.getElementById("installSheetClose");

      const originalHref = siteLink.getAttribute("href");
      const originalText = siteLink.textContent.trim();

      const isStandalone =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;

      const isIOS =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      let deferredInstallPrompt = null;
      let installMode = false;

      function enableInstallMode() {
        if (isStandalone) return;

        installMode = true;
        siteLink.textContent = "Instalar app";
        siteLink.classList.add("is-install");
        siteLink.setAttribute("aria-label", "Instalar Rádio Amizade");
        siteLink.setAttribute("role", "button");
        siteLink.removeAttribute("target");
        siteLink.removeAttribute("rel");
        siteLink.removeAttribute("href");
      }

      function disableInstallMode() {
        installMode = false;
        siteLink.textContent = originalText;
        siteLink.classList.remove("is-install");
        siteLink.removeAttribute("role");
        siteLink.setAttribute("aria-label", "Abrir amizade.fm.br");
        siteLink.setAttribute("href", originalHref);
        siteLink.setAttribute("target", "_blank");
        siteLink.setAttribute("rel", "noopener noreferrer");
      }

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./service-worker.js", { updateViaCache: "none" })
            .catch((error) => {
              console.error("Service Worker:", error);
            });
        });
      }

      // No iPhone, o fluxo é manual via Safari.
      if (!isStandalone && isIOS) {
        enableInstallMode();
      }

      // No Android/Chrome, só troca o topo quando o navegador oferecer instalação.
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        enableInstallMode();
      });

      siteLink.addEventListener("click", async (event) => {
        if (!installMode) return;

        event.preventDefault();

        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();

          try {
            await deferredInstallPrompt.userChoice;
          } finally {
            deferredInstallPrompt = null;
          }

          return;
        }

        if (isIOS) {
          installSheet.hidden = false;
        }
      });

      installSheetClose.addEventListener("click", () => {
        installSheet.hidden = true;
      });

      installSheet.addEventListener("click", (event) => {
        if (event.target === installSheet) {
          installSheet.hidden = true;
        }
      });

      window.addEventListener("appinstalled", () => {
        deferredInstallPrompt = null;
        installSheet.hidden = true;
        disableInstallMode();
      });
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

  <script>
    (() => {
      "use strict";

      const STREAM_URL =
        "https://5a2b083e9f360.streamlock.net/amizadefm/amizadefm.stream/playlist.m3u8";

      const app = document.getElementById("app");
      const audio = document.getElementById("radioStream");
      const playButton = document.getElementById("playButton");

      let hls = null;
      let hlsReady = false;
      let pendingPlay = false;
      let hasStartedPlayback = false;

      function setPlaying(isPlaying) {
        app.classList.toggle("playing", isPlaying);
        playButton.setAttribute("aria-pressed", String(isPlaying));
        playButton.setAttribute(
          "aria-label",
          isPlaying
            ? "Pausar Rádio Amizade"
            : "Ouvir Rádio Amizade ao vivo"
        );
      }

      function seekToLiveEdge() {
        if (hls) {
          const liveSyncPosition = hls.liveSyncPosition;

          if (
            Number.isFinite(liveSyncPosition) &&
            liveSyncPosition > 0
          ) {
            audio.currentTime = liveSyncPosition;
            return true;
          }
        }

        if (audio.seekable && audio.seekable.length) {
          const lastRange = audio.seekable.length - 1;
          const rangeStart = audio.seekable.start(lastRange);
          const rangeEnd = audio.seekable.end(lastRange);
          const liveTarget = Math.max(rangeStart, rangeEnd - 0.5);

          if (Number.isFinite(liveTarget)) {
            audio.currentTime = liveTarget;
            return true;
          }
        }

        return false;
      }

      function playRadio() {
        if (hasStartedPlayback) {
          seekToLiveEdge();
        }

        audio.play().catch((error) => {
          console.error("Erro ao reproduzir a rádio:", error);
          setPlaying(false);
        });
      }

      const isIOS =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      function setupNativeHls() {
        if (!audio.canPlayType("application/vnd.apple.mpegurl")) {
          return false;
        }

        audio.preload = "auto";
        audio.src = STREAM_URL;
        audio.load();
        hlsReady = true;
        return true;
      }

      function setupHlsJs() {
        if (!window.Hls || !window.Hls.isSupported()) {
          return false;
        }

        hls = new window.Hls({
          lowLatencyMode: false,
          liveSyncDurationCount: 2,
          initialLiveManifestSize: 2,
          maxBufferLength: 6,
          maxMaxBufferLength: 12
        });

        hls.loadSource(STREAM_URL);
        hls.attachMedia(audio);

        hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
          hlsReady = true;

          if (pendingPlay) {
            pendingPlay = false;
            playRadio();
          }
        });

        hls.on(window.Hls.Events.ERROR, (_, data) => {
          console.error("HLS:", data);

          if (!data.fatal) return;

          if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR) {
            hls.startLoad();
            return;
          }

          if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
            return;
          }

          setPlaying(false);
        });

        return true;
      }

      function setupStream() {
        /*
          iPhone/iPad:
          prioriza o HLS nativo do Safari e começa a preparar o stream
          assim que a página é carregada.

          Mac/Android/Desktop:
          mantém hls.js como primeira opção, pois foi a estratégia
          mais estável nos testes anteriores.
        */
        if (isIOS && setupNativeHls()) {
          return;
        }

        if (setupHlsJs()) {
          return;
        }

        if (setupNativeHls()) {
          return;
        }

        console.error("Este navegador não oferece suporte a HLS.");
        playButton.disabled = true;
        playButton.setAttribute(
          "aria-label",
          "Áudio indisponível neste navegador"
        );
      }

      playButton.addEventListener("click", () => {
        if (!audio.paused) {
          audio.pause();
          pendingPlay = false;
          return;
        }

        if (hls && !hlsReady) {
          pendingPlay = true;
          return;
        }

        playRadio();
      });

      audio.addEventListener("playing", () => {
        hasStartedPlayback = true;
        setPlaying(true);
      });

      audio.addEventListener("pause", () => {
        if (!audio.ended) {
          setPlaying(false);
        }
      });

      audio.addEventListener("ended", () => {
        setPlaying(false);
      });

      audio.addEventListener("error", () => {
        setPlaying(false);
      });

      setupStream();
    })();
  </script>
</body>
</html>
