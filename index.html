<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Rádio Amizade 98.7 FM</title>

  <meta name="theme-color" content="#111319">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #111319;
      --panel: rgba(29, 32, 39, .90);
      --panel-hover: #2a2d36;
      --red-dark: #a9001a;
      --yellow: #ffd91a;
      --text: #fff;

      --cover-size: min(64vw, 255px);
      --menu-height: 76px;

      --topo-y: 5svh;
      --quadrado-y: 24svh;
      --menu-y: 84svh;

      --titulo-y: 58svh;

      --play-size: 98px;
      --play-slot: 116px;
      --social-size: 42px;
      --social-gap: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      font-family:
        "Manrope",
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 15% 8%,
          rgba(214, 27, 67, .12) 0%,
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 55%,
          rgba(70, 75, 95, .10) 0%,
          transparent 38%
        ),
        var(--bg);
      overflow-x: hidden;
    }

    button,
    a {
      font: inherit;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    button {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      padding: 0;
    }

    /*
      POSICIONAMENTO PRINCIPAL:
      topo: 5% da altura visível
      quadrado: 24% da altura visível
      título: 58% da altura visível
      equalizador: preservado na posição anterior
      menu: 84% da altura visível.
    */

    .app {
      position: relative;
      width: min(100%, 480px);
      height: 100svh;
      margin-inline: auto;
      overflow: hidden;
    }

    .site-link {
      position: absolute;
      z-index: 30;
      top: var(--topo-y);
      left: 50%;
      transform: translateX(-50%);

      display: block;
      width: max-content;

      padding: 8px 16px;
      border-radius: 999px;

      color: rgba(255, 255, 255, .82);
      background: rgba(29, 32, 39, .82);
      box-shadow: 0 10px 24px rgba(0, 0, 0, .18);

      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .station {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .station-center {
      width: 100%;
      height: 100%;
      text-align: center;
    }

    .cover {
      position: absolute;
      top: var(--quadrado-y);
      left: 50%;
      transform: translateX(-50%);

      width: var(--cover-size);
      aspect-ratio: 1;

      border-radius: 28px;
      background:
        linear-gradient(
          180deg,
          #ffe64f 0%,
          var(--yellow) 58%,
          #f3c800 100%
        );
      box-shadow: 0 24px 40px rgba(255, 217, 26, .18);
      overflow: hidden;
      isolation: isolate;
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    .station-title {
      position: absolute;
      top: var(--titulo-y);
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      color: var(--text);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -.4px;
      text-align: center;
      white-space: nowrap;
    }

    .waves {
      position: absolute;
      top: calc(74svh - 48px);
      left: 50%;
      transform: translateX(-50%) scaleX(.86);
      z-index: 5;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      width: max-content;
      height: 34px;

      opacity: 0;
      visibility: hidden;
      transform-origin: center;
      transition:
        opacity .22s ease,
        transform .22s ease,
        visibility 0s linear .22s;
      pointer-events: none;
    }

    .playing .waves {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scaleX(1);
      transition:
        opacity .22s ease,
        transform .22s ease,
        visibility 0s;
    }

    .waves i {
      display: block;
      width: 5px;
      border-radius: 999px;
      background: var(--yellow);
      animation: wave .9s infinite ease-in-out;
      animation-play-state: paused;
      will-change: transform, opacity;
    }

    .playing .waves i {
      animation-play-state: running;
    }

    .waves i:nth-child(1) { height: 22px; }
    .waves i:nth-child(2) { height: 34px; animation-delay: .1s; }
    .waves i:nth-child(3) { height: 24px; animation-delay: .2s; }
    .waves i:nth-child(4) { height: 34px; animation-delay: .3s; }
    .waves i:nth-child(5) { height: 22px; animation-delay: .4s; }

    @keyframes wave {
      50% {
        transform: scaleY(.55);
        opacity: .65;
      }
    }

    /*
      O menu também está no fluxo normal da página.
      Não existe regra decidindo sua posição vertical na tela.

      O posicionamento interno dos ícones e do Play foi preservado,
      pois ele faz parte do desenho do próprio componente.
    */
    .menu {
      position: absolute;
      top: var(--menu-y);
      left: 22px;
      right: 22px;

      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        var(--play-slot)
        minmax(0, 1fr);
      align-items: center;

      height: var(--menu-height);

      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 22px;
      background: var(--panel);
      box-shadow:
        0 16px 34px rgba(0, 0, 0, .24),
        inset 0 1px 0 rgba(255, 255, 255, .05);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .menu-side {
      position: static;
      min-width: 0;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--social-gap);
    }

    .menu-side--left {
      grid-column: 1;
    }

    .menu-side--right {
      grid-column: 3;
    }

    .social-button {
      width: var(--social-size);
      height: var(--social-size);
      flex: 0 0 var(--social-size);

      display: grid;
      place-items: center;

      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 50%;
      background:
        linear-gradient(180deg, #23262e 0%, #1d2027 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);

      text-decoration: none;
      transition:
        transform .16s ease,
        background .16s ease,
        border-color .16s ease;
    }

    .social-button img {
      display: block;
      width: 20px;
      height: 20px;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .social-button:active {
      transform: scale(.92);
    }

    .play-button {
      position: absolute;
      z-index: 10;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: var(--play-size);
      height: var(--play-size);

      display: grid;
      place-items: center;

      border-radius: 50%;
      color: var(--yellow);
      background:
        linear-gradient(180deg, #d61b43 0%, var(--red-dark) 100%);
      box-shadow:
        0 20px 38px rgba(239, 35, 71, .32),
        inset 0 1px 0 rgba(255, 255, 255, .10);

      cursor: pointer;
      transition:
        transform .16s ease,
        filter .16s ease;
    }

    .play-button:active {
      transform: translate(-50%, -50%) scale(.95);
      filter: brightness(.97);
    }

    .play-button:disabled {
      cursor: wait;
      opacity: .72;
    }

    .play-icon,
    .pause-icon {
      width: 30px;
      height: 34px;
    }

    .play-icon {
      margin-left: 4px;
    }

    .pause-icon {
      display: none;
    }

    .playing .play-icon {
      display: none;
    }

    .playing .pause-icon {
      display: block;
    }

    .play-button:focus-visible,
    .social-button:focus-visible,
    .site-link:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 4px;
    }

    @media (hover: hover) {
      .site-link:hover {
        color: #fff;
      }

      .social-button:hover {
        background:
          linear-gradient(
            180deg,
            var(--panel-hover) 0%,
            #23262e 100%
          );
        border-color: rgba(255, 255, 255, .18);
      }
    }

    /*
      Somente ajustes HORIZONTAIS para aparelhos estreitos.
      Nenhuma regra abaixo muda a posição vertical dos blocos principais.
    */
    @media (max-width: 380px) {
      .menu {
        left: 14px;
        right: 14px;
      }

      .station-title {
        font-size: 18px;
      }
    }

    @media (max-width: 340px) {
      :root {
        --play-size: 84px;
        --play-slot: 96px;
        --social-size: 38px;
        --social-gap: 10px;
      }

      .social-button img {
        width: 18px;
        height: 18px;
      }

      .play-icon,
      .pause-icon {
        width: 27px;
        height: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .waves i {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="app" id="app">
    <a
      class="site-link"
      href="https://amizade.com.br/"
      target="_blank"
      rel="noopener noreferrer"
    >
      amizade.com.br
    </a>

    <section class="station" aria-label="Player da Rádio Amizade">
      <div class="station-center">
        <div class="cover">
          <img
            src="assets/avatar.png"
            alt="Símbolo da Rádio Amizade"
            width="1080"
            height="1080"
            decoding="async"
          >
        </div>

        <h1 class="station-title">Rádio Amizade 98.7 FM</h1>

        <span class="waves" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </span>
      </div>

      <nav class="menu" aria-label="Redes sociais e player">
        <div class="menu-side menu-side--left">
          <a
            class="social-button"
            href="https://www.instagram.com/radioamizade/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <img src="assets/icone-instagram.svg" alt="">
          </a>

          <a
            class="social-button"
            href="https://www.facebook.com/RadioAmizadeFM98.7"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
          >
            <img src="assets/icone-facebook.svg" alt="">
          </a>
        </div>

        <button
          class="play-button"
          id="playButton"
          type="button"
          aria-label="Ouvir Rádio Amizade ao vivo"
          aria-pressed="false"
        >
          <svg class="play-icon" viewBox="0 0 34 38" aria-hidden="true">
            <path
              fill="currentColor"
              d="M5 2Q3 1 3 5v28q0 4 4 2l24-14q3-2 0-4L7 3Q6 2 5 2Z"
            />
          </svg>

          <svg class="pause-icon" viewBox="0 0 30 34" aria-hidden="true">
            <rect x="4" y="2" width="8" height="30" rx="2" fill="currentColor"/>
            <rect x="18" y="2" width="8" height="30" rx="2" fill="currentColor"/>
          </svg>
        </button>

        <div class="menu-side menu-side--right">
          <a
            class="social-button"
            href="https://www.youtube.com/@RadioAmizade98.7"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="YouTube"
          >
            <img src="assets/icone-youtube.svg" alt="">
          </a>

          <a
            class="social-button"
            href="https://wa.me/5551998770145"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="WhatsApp da Rádio Amizade"
          >
            <img src="assets/icone-whatsapp.svg" alt="">
          </a>
        </div>
      </nav>

      <audio id="radioStream" preload="none" playsinline></audio>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

  <script>
    (() => {
      "use strict";

      const STREAM_URL =
        "https://5a2b083e9f360.streamlock.net/amizadefm/amizadefm.stream/playlist.m3u8";

      const app = document.getElementById("app");
      const audio = document.getElementById("radioStream");
      const playButton = document.getElementById("playButton");

      let hls = null;
      let hlsReady = false;
      let pendingPlay = false;
      let hasStartedPlayback = false;

      function setPlaying(isPlaying) {
        app.classList.toggle("playing", isPlaying);
        playButton.setAttribute("aria-pressed", String(isPlaying));
        playButton.setAttribute(
          "aria-label",
          isPlaying
            ? "Pausar Rádio Amizade"
            : "Ouvir Rádio Amizade ao vivo"
        );
      }

      function seekToLiveEdge() {
        if (hls) {
          const liveSyncPosition = hls.liveSyncPosition;

          if (
            Number.isFinite(liveSyncPosition) &&
            liveSyncPosition > 0
          ) {
            audio.currentTime = liveSyncPosition;
            return true;
          }
        }

        if (audio.seekable && audio.seekable.length) {
          const lastRange = audio.seekable.length - 1;
          const rangeStart = audio.seekable.start(lastRange);
          const rangeEnd = audio.seekable.end(lastRange);
          const liveTarget = Math.max(rangeStart, rangeEnd - 0.5);

          if (Number.isFinite(liveTarget)) {
            audio.currentTime = liveTarget;
            return true;
          }
        }

        return false;
      }

      function playRadio() {
        if (hasStartedPlayback) {
          seekToLiveEdge();
        }

        audio.play().catch((error) => {
          console.error("Erro ao reproduzir a rádio:", error);
          setPlaying(false);
        });
      }

      function setupStream() {
        /*
          Safari/iPhone: HLS nativo.
          Chrome/Android e demais navegadores compatíveis: hls.js.
        */
        if (window.Hls && window.Hls.isSupported()) {
          hls = new window.Hls({
            lowLatencyMode: false,
            liveSyncDurationCount: 3,
            initialLiveManifestSize: 3
          });

          hls.loadSource(STREAM_URL);
          hls.attachMedia(audio);

          hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
            hlsReady = true;

            if (pendingPlay) {
              pendingPlay = false;
              playRadio();
            }
          });

          hls.on(window.Hls.Events.ERROR, (_, data) => {
            console.error("HLS:", data);

            if (!data.fatal) return;

            if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR) {
              hls.startLoad();
              return;
            }

            if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) {
              hls.recoverMediaError();
              return;
            }

            setPlaying(false);
          });

          return;
        }

        if (audio.canPlayType("application/vnd.apple.mpegurl")) {
          audio.src = STREAM_URL;
          hlsReady = true;
          return;
        }

        console.error("Este navegador não oferece suporte a HLS.");
        playButton.setAttribute(
          "aria-label",
          "Áudio indisponível neste navegador"
        );
      }

      playButton.addEventListener("click", () => {
        if (!audio.paused) {
          audio.pause();
          pendingPlay = false;
          return;
        }

        if (hls && !hlsReady) {
          pendingPlay = true;
          return;
        }

        playRadio();
      });

      audio.addEventListener("playing", () => {
        hasStartedPlayback = true;
        setPlaying(true);
      });

      audio.addEventListener("pause", () => {
        if (!audio.ended) {
          setPlaying(false);
        }
      });

      audio.addEventListener("ended", () => {
        setPlaying(false);
      });

      audio.addEventListener("error", () => {
        setPlaying(false);
      });

      setupStream();
    })();
  </script>
</body>
</html>
